<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>精确查找</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="pages.css"></head><body>
<div class="phone">
<div class="statusbar">
  <span class="sb-time" data-real-time>9:41</span>
  <span class="sb-right">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="#FFF"><rect x="0" y="7.5" width="3" height="3.5" rx="1"/><rect x="4.5" y="5.5" width="3" height="5.5" rx="1"/><rect x="9" y="3" width="3" height="8" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="#FFF" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.4a10.5 10.5 0 0 1 14 0"/><path d="M3.6 6.2a6.6 6.6 0 0 1 8.8 0"/><path d="M6.2 8.9a2.9 2.9 0 0 1 3.6 0"/><circle cx="8" cy="10.2" r=".7" fill="#FFF" stroke="none"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="#FFF" stroke-opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="#FFF"/><path d="M23 4.2v3.6a2 2 0 0 0 0-3.6z" fill="#FFF" fill-opacity=".5"/></svg>
  </span>
</div>
<!-- 全屏精确查找层：深绿三停渐变底（亮头 + 暗板两层，规范 14-24） -->
<div style="position:absolute;inset:0;background:linear-gradient(180deg,#0F7A48 0%,#0B6338 42%,#073A22 100%)">

  <!-- 顶部：正在查找 + 锁名（subhead / largeTitle 30 Bold） -->
  <div style="position:absolute;left:28px;right:28px;top:72px">
    <div style="font-size:14px;font-weight:500;color:rgba(255,255,255,.85)">正在查找</div>
    <div style="font-size:30px;font-weight:700;letter-spacing:-.4px;color:#FFF;margin-top:2px">然然家 · 入户门</div>
  </div>

  <!-- 中央：300dp 空心箭头，从下往上灌绿；满绿 = 到达武装线 -->
  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;height:300px">
    <svg width="300" height="300" viewBox="0 0 300 300">
      <defs>
        <linearGradient id="fillUp" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#30D158"/><stop offset="72%" stop-color="#5FE38A"/><stop offset="100%" stop-color="#8CF0AC"/>
        </linearGradient>
        <clipPath id="arrowClip">
          <path d="M150 40 L232 148 L176 148 L176 258 L124 258 L124 148 L68 148 Z"/>
        </clipPath>
      </defs>
      <!-- 空心轮廓 -->
      <path d="M150 40 L232 148 L176 148 L176 258 L124 258 L124 148 L68 148 Z"
            fill="none" stroke="#FFF" stroke-width="7" stroke-linejoin="round" opacity=".92"/>
      <!-- 灌绿：从底部往上（信号越强越高） -->
      <g clip-path="url(#arrowClip)">
        <rect x="60" y="118" width="180" height="150" fill="url(#fillUp)" opacity=".95"/>
      </g>
      <!-- 朝向提示：箭头随握姿 ±30° 倾斜 -->
      <g transform="rotate(-8 150 150)">
        <path d="M150 40 L232 148 L176 148 L176 258 L124 258 L124 148 L68 148 Z"
              fill="none" stroke="#FFF" stroke-width="2" stroke-linejoin="round" opacity=".35"/>
      </g>
    </svg>
  </div>

  <!-- 底部左：距离档位词 + 方向（不显示米数） -->
  <div style="position:absolute;left:28px;bottom:132px">
    <div style="font-size:36px;font-weight:700;letter-spacing:-.6px;color:#FFF">就在门边</div>
    <div style="font-size:19px;font-weight:700;color:rgba(255,255,255,.92)">向右转一点</div>
  </div>

  <!-- 左下：收起（回到手动圆盘）；右下：提示音开关 -->
  <div style="position:absolute;left:28px;bottom:40px;width:52px;height:52px;border-radius:50%;
              background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center">
    <svg width="20" height="20" viewBox="0 0 20 20" stroke="#FFF" stroke-width="2.4" stroke-linecap="round">
      <path d="M4 4 L16 16 M16 4 L4 16"/>
    </svg>
  </div>
  <div style="position:absolute;right:28px;bottom:40px;width:52px;height:52px;border-radius:50%;
              background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8.5h3.5L12 5v12l-4.5-3.5H4z"/>
      <path d="M15 7.5a5 5 0 0 1 0 7"/>
    </svg>
  </div>

</div>
</div><script src="icons-render.js"></script><script src="interact.js"></script></body></html>
