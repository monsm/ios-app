<!DOCTYPE html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#000;color:#0F0;font:13px monospace;padding:12px}</style></head><body>
<div id="out">测试中…</div>
<iframe id="f" src="42-peek.html" style="width:454px;height:908px;border:0;opacity:0.01"></iframe>
<script>
setTimeout(function(){
  var out = [];
  try {
    var d = document.getElementById('f').contentDocument;
    if (!d) { out.push('✗ 无法访问 iframe'); }
    else {
      // 1. 开关点击
      var sw = d.querySelector('.sw');
      if (sw) {
        var before = sw.className;
        sw.click();
        var after = sw.className;
        out.push((before !== after ? '✓' : '✗') + ' 开关切换: "' + before + '" → "' + after + '"');
      } else out.push('· 无 .sw');
      // 2. 分段控件
      var seg = d.querySelector('.segctl2');
      if (seg) {
        var os = seg.querySelectorAll('.o');
        os[1].click();
        out.push((os[1].classList.contains('on') ? '✓' : '✗') + ' 分段切换');
      } else out.push('· 无 .segctl2');
      // 3. 主题切换
      d.documentElement.setAttribute('data-theme','light');
      var bg = getComputedStyle(d.body).backgroundColor;
      out.push('✓ 浅色 body: ' + bg);
      // 4. 链接数
      out.push('✓ 链接数: ' + d.querySelectorAll('a[href]').length);
      // 5. interact.js 加载
      out.push((d.querySelector('script[src*="interact"]') ? '✓' : '✗') + ' interact.js 已加载');
    }
  } catch(e) { out.push('✗ 异常: ' + e.message); }
  document.getElementById('out').innerHTML = out.join('<br>');
}, 2500);
</script></body></html>
