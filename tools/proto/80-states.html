<div class="phone">
<div class="statusbar">
  <span class="sb-time" data-real-time>12:00</span>
  <span class="sb-right">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="#FFF"><rect x="0" y="7.5" width="3" height="3.5" rx="1"/><rect x="4.5" y="5.5" width="3" height="5.5" rx="1"/><rect x="9" y="3" width="3" height="8" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="#FFF" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.4a10.5 10.5 0 0 1 14 0"/><path d="M3.6 6.2a6.6 6.6 0 0 1 8.8 0"/><path d="M6.2 8.9a2.9 2.9 0 0 1 3.6 0"/><circle cx="8" cy="10.2" r=".7" fill="#FFF" stroke="none"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="#FFF" stroke-opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="#FFF"/><path d="M23 4.2v3.6a2 2 0 0 0 0-3.6z" fill="#FFF" fill-opacity=".5"/></svg>
  </span>
</div><div class="scroll"><div class="page">
  <div class="h1">三种状态</div>
  <div class="sub">骨架屏 / 空态 / 错误态</div>

  

  <div class="card" style="">
    <div class="ctitle" style="font-size:18px">① 骨架屏</div>
    <div style="margin-top:14px">
      <div class="sk sk-line" style="width:40%"></div>
      <div class="sk sk-line tall" style="width:65%;margin-top:12px"></div>
      <div class="sk sk-line" style="width:90%;margin-top:10px"></div>
      <div class="sk sk-line" style="width:75%;margin-top:8px"></div>
    </div>
  </div>

  <div class="card">
    <div class="ctitle" style="font-size:18px">② 空态</div>
    <div class="empty-state">
      <div class="es-icon"><span class="svgi" data-i="info" data-sz="28px"></span></div>
      <div class="es-title">昨晚没有开门记录</div>
      <div class="es-desc">门锁正常在线，只是没人经过</div>
    </div>
  </div>

  <div class="card">
    <div class="ctitle" style="font-size:18px">③ 错误态</div>
    <div class="error-state">
      <div class="er-icon"><span class="svgi" data-i="warn" data-sz="28px"></span></div>
      <div class="er-title">连接超时</div>
      <div class="er-desc">门锁在休眠，唤醒后重试</div>
      <a class="er-act" href="#">重试</a>
    </div>
  </div>
</div></div>
