  <div class="card" style="">

  <div class="card">
    <div class="ctitle" style="font-size:18px">② 空态</div>

      <div class="es-icon"><span class="svgi" data-i="info" data-sz="28px"></span></div>

      <div class="es-desc">门锁正常在线，只是没人经过</div>
    </div>
  </div>

  <div class="card">
    <div class="ctitle" style="font-size:18px">③ 错误态</div>
    <div class="error-state">
      <div class="er-icon"><span class="svgi" data-i="warn" data-sz="28px"></span></div>
      <div class="er-title">连接超时</div>
      <div class="er-desc">门锁在休眠，唤醒后重试</div>
      <a class="er-act" href="#">重试</a>
    </div>
  </div>
