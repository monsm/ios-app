</div><div class="navbar">

  <div class="h1" style="margin-top:8px">告警中心</div>
  <div class="sub">门锁主动报上来的异常 · 处置后不再重复提醒</div>

  <!-- 图 5 MetricCard：44px 待处理数 + 三色环 + 三级彩点行 + footer -->
  <div class="card">
    <div class="cardlink">待处理</div>
    <div style="display:flex;align-items:center;gap:18px;margin-top:6px">
      <div style="flex:1;min-width:0">
        <div style="font-size:44px;font-weight:700;line-height:1;letter-spacing:-1.4px;
                    font-variant-numeric:tabular-nums;color:#FF9F0A">2<span
                    style="font-size:14px;font-weight:500;color:#8D8D93;margin-left:4px">条</span></div>
        <div style="font-size:13px;color:#8A8A90;margin-top:9px;line-height:1.5">
          最高一级 1 条 —— 先处置它，其余会自动归到已处理。
        </div>
      </div>
      <div style="position:relative;width:104px;height:104px;flex:0 0 auto">
        <svg width="104" height="104" viewBox="0 0 104 104">
          <circle cx="52" cy="52" r="48" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4.5"/>
          <circle cx="52" cy="52" r="48" fill="none" stroke="#FF3B30" stroke-width="4.5"
                  stroke-linecap="round" stroke-dasharray="30.2 301.6" transform="rotate(-90 52 52)"/>
          <circle cx="52" cy="52" r="40" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4.5"/>
          <circle cx="52" cy="52" r="40" fill="none" stroke="#FF9F0A" stroke-width="4.5"
                  stroke-linecap="round" stroke-dasharray="25.1 251.3" transform="rotate(-90 52 52)"/>
          <circle cx="52" cy="52" r="32" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4.5"/>
          <circle cx="52" cy="52" r="32" fill="none" stroke="#30D158" stroke-width="4.5"
                  stroke-linecap="round" stroke-dasharray="20.1 201.1" transform="rotate(-90 52 52)"/>
        </svg>
      </div>
    </div>
    <div class="sep"></div>
    <div style="display:flex;gap:16px">
      <div style="flex:1"><div class="clabel">一级</div><div style="font-size:16px;font-weight:600;color:#FF3B30">1 条</div></div>
      <div style="flex:1"><div class="clabel">二级</div><div style="font-size:16px;font-weight:600;color:#FF9F0A">1 条</div></div>
      <div style="flex:1"><div class="clabel">三级</div><div style="font-size:16px;font-weight:600;color:#30D158">0 条</div></div>
    </div>
    <div class="footer">一级是"可能被撬或电量见底"，二级是"能用但该处理"，三级只是记录。</div>
  </div>

  <!-- 主告警：最高级那条占整块（紧迫感的核心） -->
  <div class="card" style="border-radius:26px;box-shadow:inset 0 0 0 1px rgba(255,59,48,.28)">
    <div class="cardlink">最高一级 · 未处理</div>
    <div class="ctitle">门锁被连续试错 5 次</div>
    <div style="display:flex;gap:12px;margin-top:10px">
      <div style="flex:1"><div class="clabel">发生时间</div><div style="font-size:15px">今天 09:42</div></div>
      <div style="flex:1"><div class="clabel">涉及门锁</div><div style="font-size:15px">然然家 · 入户门</div></div>
    </div>
    <div class="sep"></div>
    <div style="display:flex;gap:10px">
      <button class="btn" style="flex:1;height:44px;border-radius:22px;background:#FF3B30;color:#FFF;font-size:15px;font-weight:600">标记已处理</button>
      <button class="btn" style="flex:1;height:44px;border-radius:22px;background:rgba(255,255,255,.10);color:#FFF;font-size:15px;font-weight:600">看审计流水</button>
    </div>
    <div class="footer">处置是"我看过了"的意思 —— 不会改门锁状态，也不会删掉审计记录。</div>
  </div>

  <!-- 列表：其余待处理 -->
  <div class="card" style="padding:0">
    <div class="cardlink" style="padding:16px 16px 8px">其余待处理</div>
    <div style="padding:0 16px 8px">
      <div style="display:flex;align-items:center;gap:12px;padding:10px 0">
        <span style="width:8px;height:8px;border-radius:50%;background:#FF9F0A;flex:0 0 auto"></span>
        <div style="flex:1;min-width:0">
          <div style="font-size:15px">电量低于 20%</div>
          <div style="font-size:12px;color:#8A8A90;margin-top:2px">然然家 · 入户门 · 今天 07:15</div>
        </div>
        <span style="font-size:12px;color:#8A8A90">二级</span>
      </div>
    </div>
  </div>

  <!-- 已处理 -->
  <div class="card" style="padding:0">
    <div class="cardlink" style="padding:16px 16px 8px">已处理</div>
    <div style="padding:0 16px 16px">
      <div style="display:flex;align-items:center;gap:12px;padding:10px 0">
        <span style="width:8px;height:8px;border-radius:50%;background:#30D158;flex:0 0 auto"></span>
        <div style="flex:1;min-width:0">
          <div style="font-size:15px">门未关好</div>
          <div style="font-size:12px;color:#8A8A90;margin-top:2px">昨天 21:08 · 已处置</div>
        </div>
      </div>
    </div>
  </div>
