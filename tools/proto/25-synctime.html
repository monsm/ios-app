<div class="phone">
<div class="statusbar">
  <span class="sb-time" data-real-time>12:00</span>
  <span class="sb-right">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="#FFF"><rect x="0" y="7.5" width="3" height="3.5" rx="1"/><rect x="4.5" y="5.5" width="3" height="5.5" rx="1"/><rect x="9" y="3" width="3" height="8" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="#FFF" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.4a10.5 10.5 0 0 1 14 0"/><path d="M3.6 6.2a6.6 6.6 0 0 1 8.8 0"/><path d="M6.2 8.9a2.9 2.9 0 0 1 3.6 0"/><circle cx="8" cy="10.2" r=".7" fill="#FFF" stroke="none"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="#FFF" stroke-opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="2" fill="#FFF"/><path d="M23 4.2v3.6a2 2 0 0 0 0-3.6z" fill="#FFF" fill-opacity=".5"/></svg>
  </span>
</div><div class="navbar">
  <a class="back" href="03-devices.html">‹</a><span class="nt">同步时间</span><span class="nr"></span></div><div class="scroll"><div class="page hasnav">

  <div class="h1" style="margin-top:8px">同步时间</div>
  <div class="sub">锁钟偏差 · 写入手机时间</div>

  <!-- skewCard：偏差 -->
  <!--VIZ-->
  <div class="card" style="margin-top:12px"><div class="cardlink">偏差范围<span class="ch"><span class="svgi" data-i="chevron"></span></span></div>
    <div style="margin-top:14px">
    <div style="position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.08)">
      <div style="position:absolute;left:35%;top:-5px;width:3px;height:16px;
        border-radius:2px;background:#FF9F0A;transform:translateX(-50%)"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#6A6A6E;margin-top:8px">
      <span>-10s</span><span>10s</span>
    </div></div>
    <div style="font-size:13px;color:var(--text-sub);margin-top:14px">校准会把手机时间写进锁内（cmd 0E）。</div></div>
  <div class="card" style="margin-top:24px">
    <div class="cardlink">锁钟偏差<span class="ch"><span class="svgi" data-i="chevron"></span></span></div>
    <div style="text-align:center;padding:18px 0 8px">
      <div style="font-size:64px;font-weight:700;letter-spacing:-2px;line-height:1;
        font-variant-numeric:tabular-nums;color:#FF9F0A">−3<span style="font-size:24px">s</span></div>
      <div style="font-size:13px;color:#8D8D93;margin-top:12px">锁比手机慢 3 秒</div>
    </div>
    <div style="margin-top:10px">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#6A6A6E;margin-bottom:6px">
        <span>−30s</span><span>0</span><span>+30s</span>
      </div>
      <div style="position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.08)">
        <div style="position:absolute;left:45%;top:-5px;width:3px;height:16px;
          border-radius:2px;background:#FF9F0A;transform:translateX(-50%)"></div>
      </div>
    </div>
    <div class="footer">偏差为正即锁慢，为负即锁快。超过 ±30 秒建议立即校准。</div>
  </div>

  <!-- clockCard：两个时钟对照 -->
  <div class="card">
    <div class="cardlink">对照<span class="ch"><span class="svgi" data-i="chevron"></span></span></div>
    <div class="duo" style="margin-top:12px;margin-bottom:0">
      <div class="metric-card">
        <div class="mh"><span class="mt">锁内时钟</span><span class="mc"><span class="svgi" data-i="chevron"></span></span></div>
        <div class="ms">读到的</div>
        <div class="mv" style="font-size:21px">06:41:57</div>
      </div>
      <div class="metric-card">
        <div class="mh"><span class="mt">手机时间</span><span class="mc"><span class="svgi" data-i="chevron"></span></span></div>
        <div class="ms">现在</div>
        <div class="mv" style="font-size:21px;color:#30D158">06:42:00</div>
      </div>
    </div>
  </div>

  <!-- actionCard：写入 -->
  <div class="card">
    <div class="cardlink">写入<span class="ch"><span class="svgi" data-i="chevron"></span></span></div>
    <div style="font-size:13px;color:#8D8D93;line-height:1.6;margin-top:6px">
      校准会把手机时间写进锁内（cmd 0E）。写入前请确认手机时间准确。
    </div>
    <button class="btn" style="margin-top:14px">将手机时间同步到锁内</button>
    <div class="footer">请将手机靠近门锁。</div>
  </div>
