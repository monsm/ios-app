<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="01-home.html" style="width:390px;height:2400px;border:0"></iframe>
<script>
window.addEventListener('load',()=>setTimeout(()=>{
  try{
    const d=document.getElementById('f').contentDocument;
    const pg=d.querySelector('.page');
    const h = pg ? Math.round(pg.scrollHeight || pg.getBoundingClientRect().height) : 0;
    document.title = 'HEIGHT_IS_' + h;
  }catch(e){ document.title='HEIGHT_IS_ERR'; }
},500));
</script></body></html>
