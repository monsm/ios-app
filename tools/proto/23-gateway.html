  <div class="h1" style="margin-top:8px">智能网关</div>
  <div class="sub">仅支持 2.4GHz 网络</div>

  <!-- 步骤 1：先把网关重置（源码原文）-->
  <!--VIZ-->
  <div class="card" style="margin-top:12px"><div class="cardlink">配网步骤<span class="ch"><span class="svgi" data-i="chevron"></span></span></div>
    <div style="display:flex;gap:8px;margin-top:14px">
    <div style="flex:1;text-align:center">
      <div style="height:5px;border-radius:3px;background:#5E5CE6"></div>
      <div style="font-size:12px;color:#5E5CE6;margin-top:9px;font-weight:600">重置网关</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="height:5px;border-radius:3px;background:rgba(255,255,255,.10)"></div>
      <div style="font-size:12px;color:#6A6A6E;margin-top:9px;font-weight:400">连接 WiFi</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="height:5px;border-radius:3px;background:rgba(255,255,255,.10)"></div>
      <div style="font-size:12px;color:#6A6A6E;margin-top:9px;font-weight:400">添加到 App</div>
    </div></div></div>
  <div class="card" style="margin-top:24px;background:linear-gradient(160deg,#5E5CE6,#3C489C);padding:20px">
    <div style="text-align:center;padding:4px 0 8px">
      <div style="color:#FFF;width:34px;height:34px;margin:0 auto"><span class="svgi" data-i="wifi" data-sz="34px"></span></div>
      <div style="font-size:18px;font-weight:700;color:#FFF;margin-top:12px">先把网关重置</div>
      <div style="font-size:13px;color:rgba(255,255,255,.78);margin-top:10px;line-height:1.6">
        接通电源 → 长捅重置孔约 5 秒<br>→ 等待指示灯变成橙色</div>
    </div>
    <div style="height:1px;background:rgba(255,255,255,.18);margin:14px 0"></div>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:15px;color:#FFF;flex:1">指示灯已变成橙色</span>
      <span class="sw on"></span>
    </div>
    <div style="text-align:center;font-size:12px;color:rgba(255,255,255,.6);margin-top:10px">
      勾选后进入下一步</div>
  </div>

  <!-- 步骤 2：配置 WiFi（源码原文）-->
  <div class="card">
    <div class="cardlink">配置 WiFi<span class="ch"><span class="svgi" data-i="chevron"></span></span></div>
    <input class="inp" style="margin-top:12px" placeholder="WiFi 名称">
    <input class="inp" style="margin-top:10px" placeholder="输入密码" type="password">
    <div style="font-size:12px;color:#5E5CE6;margin-top:10px">仅支持 2.4GHz —— 5GHz 连不上</div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn sec" style="flex:1">上一步</button>
      <button class="btn" style="flex:1">开始配网</button>
    </div>
  </div>

  <!-- 步骤 3：配网进度 -->
  <div class="card">
    <div class="cardlink">配网进度<span class="ch"><span class="svgi" data-i="chevron"></span></span></div>
    <div class="sep" style="margin-top:12px"></div>
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:12px">
      <div style="display:flex;gap:12px;align-items:center">
          <div style="width:24px;height:24px;border-radius:50%;flex:0 0 auto;
            background:rgba(48,209,88,.16);
            color:#30D158;display:flex;align-items:center;
            justify-content:center;font-size:12px;font-weight:600"><span class="svgi" data-i="check"></span></div>
          <div style="flex:1"><div style="font-size:15px">重置网关</div>
          <div style="font-size:12px;color:#8D8D93;margin-top:2px">指示灯变橙</div></div>
        </div><div style="display:flex;gap:12px;align-items:center">
          <div style="width:24px;height:24px;border-radius:50%;flex:0 0 auto;
            background:rgba(255,255,255,.06);
            color:#6A6A6E;display:flex;align-items:center;
            justify-content:center;font-size:12px;font-weight:600">2</div>
          <div style="flex:1"><div style="font-size:15px">配置 WiFi</div>
          <div style="font-size:12px;color:#8D8D93;margin-top:2px">仅 2.4GHz</div></div>
        </div><div style="display:flex;gap:12px;align-items:center">
          <div style="width:24px;height:24px;border-radius:50%;flex:0 0 auto;
            background:rgba(255,255,255,.06);
            color:#6A6A6E;display:flex;align-items:center;
            justify-content:center;font-size:12px;font-weight:600">3</div>
          <div style="flex:1"><div style="font-size:15px">添加完成</div>
          <div style="font-size:12px;color:#8D8D93;margin-top:2px">给网关起个名字</div></div>
        </div>
    </div>
    <div class="sep"></div>
    <div style="display:flex;justify-content:space-between;font-size:14px">
      <span style="color:#8D8D93">状态</span><span style="color:#5E5CE6">未联网</span>
    </div>
    <div class="footer">重新配网会清除网关里已保存的 WiFi 信息。</div>
  </div>
