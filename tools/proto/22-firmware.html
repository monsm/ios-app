  <div class="h1">固件升级</div>
  <div class="sub">升级前请完成全部检查项</div>

  <div class="card" style="margin-top:24px">
    <div class="cardlink">版本<span class="ch"><span class="svgi" data-i="chevron"></span></span></div>
    <div style="margin-top:6px;display:flex;align-items:center;justify-content:center;gap:24px">
    <div style="text-align:center">
      <div style="font-size:11px;color:#8D8D93">当前</div>
      <div style="font-size:38px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums">1.0.2</div>
    </div>
    <div style="color:#6A6A6E;font-size:20px">→</div>
    <div style="text-align:center">
      <div style="font-size:11px;color:#8D8D93">目标</div>
      <div style="font-size:38px;font-weight:700;margin-top:4px;color:#5E5CE6">未选</div>
    </div>
  </div>
  </div>

  <div class="card" style="margin-top:26px">
    <div class="cardlink">升级进度<span class="ch"><span class="svgi" data-i="chevron"></span></span></div>
    <div style="display:flex;gap:8px;margin-top:14px">
    <div style="flex:1;text-align:center">
      <div style="height:5px;border-radius:3px;background:#5E5CE6"></div>
      <div style="font-size:12px;color:#5E5CE6;margin-top:9px;font-weight:600">检查</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="height:5px;border-radius:3px;background:rgba(255,255,255,.10)"></div>
      <div style="font-size:12px;color:#6A6A6E;margin-top:9px;font-weight:400">传输</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="height:5px;border-radius:3px;background:rgba(255,255,255,.10)"></div>
      <div style="font-size:12px;color:#6A6A6E;margin-top:9px;font-weight:400">写入</div>
    </div>
    <div style="flex:1;text-align:center">
      <div style="height:5px;border-radius:3px;background:rgba(255,255,255,.10)"></div>
      <div style="font-size:12px;color:#6A6A6E;margin-top:9px;font-weight:400">完成</div>
    </div></div>
    <div class="sep"></div>
    <div style="font-size:13px;color:#8D8D93;line-height:1.6">
      请保持手机靠近门锁，升级过程中不要离开页面。
    </div>
  </div>

  <div class="duo">
    <div class="metric-card">
      <div class="mh"><span class="mt">电量</span><span class="mc"><span class="svgi" data-i="chevron"></span></span></div>
      <div class="ms">升级需 ≥30%</div>
      <div class="mv" style="color:#30D158">47<small>%</small></div>
      <div style="font-size:11px;color:#30D158;margin-top:10px">✓ 充足</div>
    </div>
    <div class="metric-card">
      <div class="mh"><span class="mt">连接</span><span class="mc"><span class="svgi" data-i="chevron"></span></span></div>
      <div class="ms">蓝牙</div>
      <div class="mv" style="font-size:19px;color:#30D158">已就绪</div>
      <div style="font-size:11px;color:#8D8D93;margin-top:10px">−76 dBm</div>
    </div>
  </div>

  <div class="card">
    <div class="cardlink">升级前检查<span class="ch"><span class="svgi" data-i="chevron"></span></span></div>
    <div style="display:flex;flex-direction:column;gap:16px;margin-top:12px">
      <div style="display:flex;align-items:center;gap:10px">
          <span class="badge ok">✓</span>
          <div style="flex:1"><div style="font-size:15px">电量充足</div>
          <div style="font-size:12px;color:#8D8D93;margin-top:2px">当前 47%</div></div></div><div style="display:flex;align-items:center;gap:10px">
          <span class="badge ok">✓</span>
          <div style="flex:1"><div style="font-size:15px">蓝牙已开启</div>
          <div style="font-size:12px;color:#8D8D93;margin-top:2px">已就绪</div></div></div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="sw on" style="transform:scale(.8);transform-origin:left"></span>
        <span style="font-size:15px;flex:1">已生成升级前备份</span></div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="sw on" style="transform:scale(.8);transform-origin:left"></span>
        <span style="font-size:15px;flex:1">时间充足，不会中途离开</span></div>
    </div>
  </div>

  <button class="btn ghost" style="margin-top:4px">选择固件包（.zip）</button>
  <button class="btn" style="margin-top:10px;background:rgba(255,255,255,.10);color:#5A5A5E">开始升级</button>
