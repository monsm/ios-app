<!DOCTYPE html><html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;overflow:hidden;background:#000}svg{display:block;width:128px;height:128px}</style>
</head><body><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <defs>
    <clipPath id="c4"><circle cx="50" cy="50" r="42"/></clipPath>
    <linearGradient id="g4" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#B8860B"/><stop offset="1" stop-color="#6B4A00"/>
    </linearGradient>
    <linearGradient id="edge4" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFF" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#FFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <!-- 外圈金属边框 -->
  <g>
    <g fill="#B8BEC8"><circle cx="50" cy="50" r="42"/></g>
    <g fill="none" stroke="#E8ECF2" stroke-width="1.6" opacity=".8"><circle cx="50" cy="50" r="42"/></g>
  </g>
  <!-- 主体 -->
  <g clip-path="url(#c4)">
    <rect width="100" height="100" fill="url(#g4)"/>
    <!-- 斜条纹 -->
    <g opacity=".22" stroke="#FFF" stroke-width="7">
      <line x1="-10" y1="20" x2="60" y2="-10"/>
      <line x1="-10" y1="45" x2="75" y2="-10"/>
      <line x1="-10" y1="70" x2="90" y2="-10"/>
    </g>
    <!-- 字母 -->
    <text x="50" y="62" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif"
      font-size="34" font-weight="800" fill="#FFF"
      letter-spacing="-1">C</text>
    <!-- 高光 -->
    <rect width="100" height="100" fill="url(#edge4)"/>
  </g>
</svg></body></html>
