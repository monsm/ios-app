<!DOCTYPE html><html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;overflow:hidden;background:#000}svg{display:block;width:256px;height:256px}</style>
</head><body><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 背景：虚化的环境光斑（照片景深感） -->
    <filter id="bgblur11"><feGaussianBlur stdDeviation="6"/></filter>
    <radialGradient id="bg11" cx="0.5" cy="0.35">
      <stop offset="0" stop-color="#3A4A6B"/><stop offset="1" stop-color="#0A0A0E"/>
    </radialGradient>
    <!-- 皮肤：径向渐变 + 高光 -->
    <radialGradient id="skin11" cx="0.38" cy="0.30">
      <stop offset="0" stop-color="#FFF" stop-opacity=".55"/>
      <stop offset=".28" stop-color="#C68B6E"/>
      <stop offset="1" stop-color="#2A2028"/>
    </radialGradient>
    <radialGradient id="hair11" cx="0.4" cy="0.2">
      <stop offset="0" stop-color="#2A1A14"/><stop offset="1" stop-color="#08070A"/>
    </radialGradient>
    <!-- 边缘光（轮廓分离） -->
    <linearGradient id="rim11" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#FFF" stop-opacity=".30"/>
      <stop offset=".35" stop-color="#FFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFF" stop-opacity=".16"/>
    </linearGradient>
    <filter id="soft11"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <rect width="100" height="100" fill="url(#bg11)"/>
  <!-- 背景光斑 -->
  <g filter="url(#bgblur11)" opacity=".7">
    <circle cx="33.0502674789402" cy="25.632277015425394" r="23.66422725266974" fill="#3A4A6B" opacity=".8"/>
    <circle cx="67.9853087700835" cy="28.995606664100478" r="20.901140218088933" fill="#3A4A6B" opacity=".55"/>
    <circle cx="62.35537053661206" cy="84.07459498107181" r="19.106642485180238" fill="#3A4A6B" opacity=".4"/>
  </g>

  <!-- 肩与颈 -->
  <g filter="url(#soft11)">
    <ellipse cx="50" cy="104" rx="41.6824979203206" ry="34.86230850446145" fill="url(#skin11)"/>
  </g>
  <!-- 头 -->
  <g filter="url(#soft11)">
    <ellipse cx="50" cy="46" rx="27.03391647387013" ry="32.441053391639635" fill="url(#skin11)"/>
  </g>
  <!-- 头发（覆盖上半 + 两侧） -->
  <path d="M 22 40 Q 26 10 50 8 Q 74 10 78 40 Q 74 26 50 22 Q 26 26 22 40 Z"
        fill="url(#hair11)" filter="url(#soft11)"/>
  <!-- 边缘光 -->
  <ellipse cx="50" cy="46" rx="26.18595886239128" ry="31.496089995604052" fill="url(#rim11)" opacity=".5"/>
</svg></body></html>
