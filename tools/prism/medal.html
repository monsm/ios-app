<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// 奖牌素材 —— 参考图 5 的 Awards 卡
// 规范 §6.4.3：透明底 / 主光左上 / 主体比卡片底色亮 ≥3 档 / 自带落地影 / 无文字
const W = 512, H = 512;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
cam.position.set(0, 0.9, 7.4);
cam.lookAt(0, 0, 0);

// 布光：左上方主光（与参考图一致）
const key = new THREE.DirectionalLight(0xffffff, 3.4); key.position.set(-3.2, 4.6, 4.4); scene.add(key);
const fill = new THREE.DirectionalLight(0xD8E4FF, 1.0); fill.position.set(3.8, 1.2, 2.2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xFFF0E0, 1.8); rim.position.set(0.4, -1.4, -4.6); scene.add(rim);
scene.add(new THREE.AmbientLight(0x94A0B0, 0.9));

// ══ 程序化环境贴图（所有素材共用）══
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.BoxGeometry(30,30,30),
  new THREE.MeshBasicMaterial({ color: 0x14161C, side: THREE.BackSide })));
const mkPanel = (w,h,color,pos,rot) => {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color}));
  p.position.set(...pos); if(rot) p.rotation.set(...rot); p.lookAt(0,0,0); envScene.add(p);
};
mkPanel(12,12,0xFFFFFF,[-9,10,8]);
mkPanel(8,14,0x8FA8FF,[11,2,4]);
const topP = new THREE.Mesh(new THREE.PlaneGeometry(20,3), new THREE.MeshBasicMaterial({color:0xE8F0FF}));
topP.position.set(0,14,0); topP.rotation.x = Math.PI/2; envScene.add(topP);
const botP = new THREE.Mesh(new THREE.PlaneGeometry(16,16), new THREE.MeshBasicMaterial({color:0x2A2E38}));
botP.position.set(0,-14,0); botP.rotation.x = -Math.PI/2; envScene.add(botP);
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
scene.environment = pmrem.fromScene(envScene, 0.04).texture;

// ══ 程序化拉丝法线贴图 ══
function brushedNormal(size, strength) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d'); const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const n = Math.sin(y*3.7 + Math.sin(x*0.11)*2.1)*0.5
            + Math.sin(y*11.3 + x*0.03)*0.3 + Math.sin(y*23.1)*0.2;
    const i = (y*size+x)*4;
    img.data[i] = 128 + n*strength*127; img.data[i+1] = 128; img.data[i+2] = 255; img.data[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3,3);
  return t;
}
const NORMAL = brushedNormal(256, 0.35);

const top = new THREE.DirectionalLight(0xffffff, 2.0); top.position.set(0, 6, 1.4); scene.add(top);

// 奖牌：三层同心圆盘（金属拉丝），中心凸起
const OUTER = 2.05, MID = 1.62, INNER = 0.95;
const gold = new THREE.MeshStandardMaterial({ color: 0xD9A05C, metalness: 0.92, roughness: 0.24 , envMapIntensity: 1.3 });
const goldDark = new THREE.MeshStandardMaterial({ color: 0x9A6E38, metalness: 0.88, roughness: 0.34 , envMapIntensity: 1.3 });
const silver = new THREE.MeshStandardMaterial({ color: 0xC8CEDA, metalness: 0.94, roughness: 0.18 , envMapIntensity: 1.3 });
const center = new THREE.MeshStandardMaterial({ color: 0xF2D9B0, metalness: 0.75, roughness: 0.12 , envMapIntensity: 1.3 });

const group = new THREE.Group();
// 外盘（厚环）
const outer = new THREE.Mesh(new THREE.CylinderGeometry(OUTER, OUTER, 0.30, 96), gold);
outer.rotation.x = Math.PI/2; group.add(outer);
// 外盘内凹
const outerGroove = new THREE.Mesh(new THREE.TorusGeometry(OUTER*0.86, 0.075, 24, 96), goldDark);
outerGroove.position.z = 0.16; group.add(outerGroove);
// 中盘
const mid = new THREE.Mesh(new THREE.CylinderGeometry(MID, MID, 0.36, 96), silver);
mid.rotation.x = Math.PI/2; mid.position.z = 0.06; group.add(mid);
// 中盘环
const midRing = new THREE.Mesh(new THREE.TorusGeometry(MID*0.90, 0.055, 20, 96), gold);
midRing.position.z = 0.24; group.add(midRing);
// 中心凸起
const inner = new THREE.Mesh(new THREE.SphereGeometry(INNER, 64, 48), center);
inner.scale.z = 0.42; inner.position.z = 0.16; group.add(inner);
scene.add(group);

// 落地影（§6.4.3 主体下方柔和影 rgba(0,0,0,.45) 模糊 ≥12）
group.position.y = 0.05; group.scale.setScalar(0.80);

renderer.render(scene, cam);

// 输出：等一帧确保渲染完成
requestAnimationFrame(() => {
  renderer.render(scene, cam);
  document.title = 'READY';
});
</script>
</body></html>
