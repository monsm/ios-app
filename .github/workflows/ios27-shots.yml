# iOS 27 模拟器截图 —— **独立 workflow**（2026-11-03）
#
# 为什么拆出来：截图作业要建模拟器 App 并做 25+ 次启动拍照，单次 12~15 分钟。
# 它原来和 gates/build 在同一个 workflow 里，一旦 simctl 挂起就把整条队列堵住 40 分钟，
# 编译反馈跟着一起等。拆成独立 workflow 后：
#   · 编译/闸门走 ios27.yml，8~10 分钟出结果；
#   · 截图单独跑，失败/超时只影响截图，不影响编译结论。
#
# 触发：推 main（同一套 paths 过滤）+ 手动。
name: Shots (iOS 27 simulator)

on:
  push:
    branches: [main, master]
    paths:
      - "ios27/**"
      - ".github/workflows/ios27-shots.yml"
  workflow_dispatch:

concurrency:
  group: ios27-shots-${{ github.ref }}
  # 2026-11-03：**不取消进行中的截图 run**。截图要 12~15 分钟，连续提交时
  # cancel-in-progress 会让它永远跑不完 —— 实测 ci-shots 在 8 个提交里一次都没更新。
  # 截图是评审输入，宁可出一批"稍旧但完整"的图，也不要一张都没有。
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: ios27

jobs:
  shots:
    name: 模拟器截图（诊断用）
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: 安装 XcodeGen
        run: brew install xcodegen || true
      - name: 生成工程
        run: xcodegen generate
      - name: 选一个可用模拟器
        id: sim
        run: |
          set -e
          LINE=$(xcrun simctl list devices available | grep -m1 "iPhone" || true)
          echo "$LINE"
          DEV=$(echo "$LINE" | grep -oE "[0-9A-Fa-f-]{36}" | head -1)
          echo "udid=$DEV" >> "$GITHUB_OUTPUT"
          test -n "$DEV"
      - name: 编译到模拟器
        run: |
          set -o pipefail
          xcodebuild build -project LockKeeper.xcodeproj -scheme LockKeeper \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/Sim -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tail -40
      - name: 逐 Tab 截图
        run: |
          set +e
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find build/Sim/Build/Products -name "LockKeeper.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" "$APP" || exit 1
          # 预授权系统弹窗 —— 否则第一次启动的通知权限对话框会挡住截图（13 号截图实测被挡）。
          xcrun simctl privacy "$UDID" grant notifications com.aapk.lockkeeper 2>/dev/null || true
          xcrun simctl privacy "$UDID" grant user_tracking com.aapk.lockkeeper 2>/dev/null || true
          xcrun simctl privacy "$UDID" grant localnetwork com.aapk.lockkeeper 2>/dev/null || true
          xcrun simctl spawn "$UDID" defaults write com.aapk.lockkeeper NSUserNotificationUsageDescriptionIsUseless -bool YES 2>/dev/null || true
          mkdir -p /tmp/shots
          # 合成数据（kf-bundle 格式）：让刻度盘/凭证卡/时间线有东西可渲染。
          # 文件在仓库 .github-seed/，PIN/skey 全部合成，不含真密钥。
          SEED_SRC="$GITHUB_WORKSPACE/ios27/.github-seed/kf-seed.json"
          APPDATA=$(xcrun simctl get_app_container "$UDID" com.aapk.lockkeeper data 2>/dev/null || true)
          if [ -n "$APPDATA" ] && [ -f "$SEED_SRC" ]; then
            mkdir -p "$APPDATA/Documents"
            cp "$SEED_SRC" "$APPDATA/Documents/kf-seed.json"
            echo "seed placed at $APPDATA/Documents/kf-seed.json"
          fi
          i=0
          for name in door keys records household settings; do
            xcrun simctl terminate "$UDID" com.aapk.lockkeeper 2>/dev/null || true
            xcrun simctl launch "$UDID" com.aapk.lockkeeper -kfUITest -kfSeed -kfTab $i || true
            sleep 4
            xcrun simctl io "$UDID" screenshot "/tmp/shots/$i-$name.png" || true
            i=$((i+1))
          done
          # 整页截屏（**算法级**，不是滚到底）：App 把 ScrollView 的 frame 临时撑到
          # contentSize 高度后一次成像，中间内容不会漏。产物落在 App 容器 Documents/，
          # 这里用 simctl get_app_container 拷出来，命名 <i>-<name>-full.png。
          i=0
          for name in door keys records household settings; do
            xcrun simctl terminate "$UDID" com.aapk.lockkeeper 2>/dev/null || true
            xcrun simctl launch "$UDID" com.aapk.lockkeeper -kfUITest -kfSeed -kfFullPage -kfTab $i || true
            sleep 7
            CONTAINER=$(xcrun simctl get_app_container "$UDID" com.aapk.lockkeeper data 2>/dev/null || true)
            if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/kf-fullpage-$i-tab.png" ]; then
              cp "$CONTAINER/Documents/kf-fullpage-$i-tab.png" "/tmp/shots/$i-$name-full.png" || true
            else
              echo "fullpage missing for $name (tab $i)"
            fi
            i=$((i+1))
          done
          # 2026-11-03：关键子页 —— 大标题模式、读数网格、凭证行、工作流都要看真机渲染。
          # ASCII 名（中文名经 locale 管道会变 mojibake）；每个目标截 2 次（竞态重试）。
          # 缺某张图 = 那个子页在空数据下崩了 —— 本身就是 god 模式要抓的缺陷。
          j=10
          for dest in lockStatus deviceInfo lockSettings defend keyCreate zotp recordsStudio backupStudio godMode hardware; do
            xcrun simctl terminate "$UDID" com.aapk.lockkeeper 2>/dev/null || true
            xcrun simctl launch "$UDID" com.aapk.lockkeeper -kfUITest -kfSeed -kfDest "$dest" || true
            sleep 5
            xcrun simctl io "$UDID" screenshot "/tmp/shots/$j-$dest.png" 2>/dev/null || true
            sleep 1
            xcrun simctl io "$UDID" screenshot "/tmp/shots/$j-$dest.png" 2>/dev/null || true
            j=$((j+1))
          done
          # 子页整页截图：-kfDest 压栈 + -kfFullPage 整页成像（App 侧延迟 5.5s 等 push 完成）。
          j=10
          for dest in lockStatus deviceInfo lockSettings defend keyCreate zotp recordsStudio backupStudio godMode hardware; do
            xcrun simctl terminate "$UDID" com.aapk.lockkeeper 2>/dev/null || true
            xcrun simctl launch "$UDID" com.aapk.lockkeeper -kfUITest -kfSeed -kfFullPage -kfTab 0 -kfDest "$dest" || true
            sleep 8
            CONTAINER=$(xcrun simctl get_app_container "$UDID" com.aapk.lockkeeper data 2>/dev/null || true)
            if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/kf-fullpage-0-$dest.png" ]; then
              cp "$CONTAINER/Documents/kf-fullpage-0-$dest.png" "/tmp/shots/$j-$dest-full.png" || true
            else
              echo "subpage fullpage missing: $dest"
            fi
            j=$((j+1))
          done
          ls -la /tmp/shots
      - name: 空白页检测（整页单色 = 页面卡死/崩溃）
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, sys
          try:
              from PIL import Image, ImageStat
          except Exception as e:
              print("PIL 不可用，跳过空白检测:", e); sys.exit(0)
          bad = []
          for f in sorted(glob.glob("/tmp/shots/*.png")):
              try:
                  im = Image.open(f).convert("RGB").resize((64, 128))
                  st = ImageStat.Stat(im)
                  spread = max(st.stddev)
                  if spread < 6:
                      bad.append((os.path.basename(f), round(spread, 2)))
              except Exception as e:
                  bad.append((os.path.basename(f), "unreadable"))
          if bad:
              print("::warning::疑似空白页（整页单色，页面可能卡死/崩溃）：")
              for name, v in bad:
                  print(f"  {name}  stddev={v}")
              with open("/tmp/shots/blank-report.txt", "w") as fh:
                  fh.write("\n".join(f"{n}\t{v}" for n, v in bad))
          else:
              print("空白检测通过：所有截图都有内容")
          PY

      - name: 推到 ci-shots 分支
        if: github.event_name == 'push' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cd /tmp/shots || exit 0
          echo "commit=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" > meta.txt
          echo "run=$GITHUB_RUN_ID" >> meta.txt
          echo "count=$(ls *.png 2>/dev/null | wc -l | tr -d ' ')" >> meta.txt
          git init -q .
          git checkout -q -b ci-shots
          git config user.name ci
          git config user.email ci@local
          git add -A
          git commit -q -m "ci shots $GITHUB_RUN_ID" || true
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots || true

