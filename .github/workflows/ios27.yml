# ios27 云编译 —— 全新 iOS 27 App 的闸门 + 编译
#
# 镜像: `xcode-27`（Public preview, macOS 27 arm64）—— 带 iOS 27.0/27.1/27.2 SDK。
#   与仓库里既有的 ios.yml 同一个镜像；它抽风时把 runs-on 改回 macos-latest 即可。
#
# 为什么需要云端：开发机是 Windows，没有 Xcode，也没有 iOS 模拟器。
# 本地能跑的是 20 道静态闸门 + DesignLab 截图；真编译只能在这里做。
#
# 关键技巧（从既有 ios.yml 学来的）：SWIFT_COMPILATION_MODE=wholemodule
#   默认增量模式下一个文件失败就停，只能一轮挤一个错。整模块单次调用会把**全仓所有** error
#   一次列出来 —— 这个 App 还没在真编译器上跑过，第一轮大概率有一批，必须一次看全。
name: ios27

on:
  push:
    branches: [main, master]
    paths:
      - "ios27/**"
      - ".github/workflows/ios27.yml"
  pull_request:
    paths:
      - "ios27/**"
      - ".github/workflows/ios27.yml"
  workflow_dispatch:

# 2026-11-03：**队列控制**。之前每个 push 都排一整套（gates+golden+build+shots，约 13-20 分钟），
# 连续几次提交就把队列堆到一小时。同一个分支只保留最新一次：新 push 到达时取消还在跑的旧 run。
# 产物（IPA/截图）由新 run 重新产出；ci-shots 是独立分支，不受取消影响。
concurrency:
  group: ios27-${{ github.ref }}
  # 2026-11-03 实测两种策略的代价：
  #   · cancel: true  → 连续推送时截图被打断，ci-shots 跨 8 个提交零更新；
  #   · cancel: false → 每个提交跑完整 run（约 25 分钟），4 个提交 = 100 分钟才轮到最新代码。
  # 结论：**队列不能无限堆积**。恢复 cancel: true，靠"降低推送频率"解决截图被打断
  # —— 一个轮次只推一次，让每次 run 有 25 分钟跑完。
  cancel-in-progress: true

permissions:
  # Release 资产是公开直链可下载的；artifact 下载要登录，所以 IPA 必须挂 Release。
  contents: write

defaults:
  run:
    working-directory: ios27

jobs:
  # ================= 静态闸门（本地同款，先红就别浪费编译时间）=================
  gates:
    name: 静态闸门（41 道）
    runs-on: ubuntu-latest
    # G-11：镜像抽风时不要按默认 6 小时占着跑。
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 安装 tree-sitter（真 Swift 语法树闸门依赖）
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 闸门脚本自身语法检查（工具也是代码）
        run: for f in Gates/*.js DesignLab/*.js; do node --check "$f" || exit 1; done

      - name: 跑全部闸门
        run: node Gates/allgates.js

      - name: DesignLab 生成（只生成 HTML，不截图 —— CI 上没有 Edge）
        run: node DesignLab/run.js --html-only

      - name: 上传 DesignLab 预览页
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios27-designlab
          path: ios27/DesignLab/out
          if-no-files-found: ignore

  # ================= 金标差分测试（引擎层回归，G-07）=================
  # 引擎层的回归保护（G-07）。旧仓的 fixtures/golden.json（40 条命令帧 / NIST AES /
  # 状态与日志解析 / ZOTP / 归属推断）在本仓一直"存在但没人跑"。
  #
  # 放在 xcode-27 而不是 macos-latest：后者只有 Xcode 26.6（最高 iOS 26.x runtime），
  # 而本工程部署目标是 iOS 27.0 ⇒ 那个镜像上**永远**没有合法 destination。
  # xcode-27 有 iOS 27 SDK；runtime 若缺失就显式下载，仍拿不到则如实标 test_executed=no。
  golden:
    name: 金标差分测试（引擎回归）
    runs-on: xcode-27
    needs: gates
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 金标差分测试
        id: golden
        run: |
          set -o pipefail
          mkdir -p build
          echo "== Xcode =="; xcodebuild -version
          has_runtime() { xcrun simctl list runtimes 2>/dev/null | grep -qE "iOS (2[7-9]|[3-9][0-9])\."; }
          if ! has_runtime; then
            echo "== 无 iOS 27+ 模拟器 runtime，尝试下载 =="
            xcodebuild -downloadPlatform iOS 2>&1 | tail -25 || true
          fi
          echo "== 可用 runtime =="; xcrun simctl list runtimes || true
          if ! has_runtime; then
            echo "test_executed=no" >> "$GITHUB_OUTPUT"
            echo "::warning::仍无 iOS 27+ 模拟器 runtime —— 金标测试本轮**未执行**（不是通过）。"
            echo '本机跑法：xcodebuild test -scheme LockKeeper -destination "platform=iOS Simulator,name=<设备>"' | tee build/test.log
            exit 0
          fi
          # 取一台真可用的 iPhone。用 simctl 的 JSON，**不要用 sed 的 s**：
          # BSD sed 不支持它，上一版因此把整行当成设备名，一条断言都没跑。
          DEV=$(xcrun simctl list devices available -j 2>/dev/null | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          names = [n["name"] for v in d.get("devices", {}).values() for n in v
                   if n.get("isAvailable") and n.get("name", "").startswith("iPhone")]
          print(names[0] if names else "")
          ')
          if [ -z "$DEV" ]; then
            echo "test_executed=no" >> "$GITHUB_OUTPUT"
            echo "::warning::有 runtime 但取不到可用 iPhone 设备 —— 金标测试本轮**未执行**。"
            exit 0
          fi
          echo "测试设备: $DEV"
          echo "test_executed=yes" >> "$GITHUB_OUTPUT"
          # 2026-11-05（CI 死锁修复）：原来这里没有任何单测超时。
          # 观测到两次 run 卡在「金标差分测试」20+ 分钟不动，而 job 上限是 60 分钟 ——
          # 一个挂住的测试就能堵死整条队列（并发组串行）。
          # -test-timeouts-enabled 让**单个测试**超过 120 秒直接失败，不再无限等待。
          xcodebuild test \
            -project LockKeeper.xcodeproj \
            -scheme LockKeeper \
            -destination "platform=iOS Simulator,name=$DEV" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -derivedDataPath build/DerivedData \
            -configuration Debug \
            SWIFT_COMPILATION_MODE=wholemodule \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/test.log

      - name: 测试失败时把错误转成注解
        if: failure()
        run: |
          grep -E "error:|Testing failed:|XCTAssert" build/test.log 2>/dev/null | head -40 \
            | sed "s#^#::error file=ios27/Tests::#" || true

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios27-golden-test
          path: ios27/build/test.log
          if-no-files-found: ignore

      # 与 build job 的 ci-log 分开：两个 job 并发，同时 force-push 同一个孤儿分支
      # 会互相覆盖。用独立的 ci-test 分支，本地 git fetch 就能读到测试结论。
      - name: 发布测试结果到 ci-test 分支
        if: github.event_name == 'push' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p /tmp/citest
          [ -f build/test.log ] && cp build/test.log /tmp/citest/test.log
          echo "commit=$(git rev-parse HEAD)" > /tmp/citest/meta.txt
          echo "run=$GITHUB_RUN_ID" >> /tmp/citest/meta.txt
          echo "job=$GITHUB_JOB" >> /tmp/citest/meta.txt
          echo "test_log=$([ -f /tmp/citest/test.log ] && echo yes || echo no)" >> /tmp/citest/meta.txt
          echo "test_ok=$(grep -c "TEST SUCCEEDED" /tmp/citest/test.log 2>/dev/null || echo 0)" >> /tmp/citest/meta.txt
          echo "test_failed=$(grep -cE "TEST FAILED|Testing failed:" /tmp/citest/test.log 2>/dev/null || echo 0)" >> /tmp/citest/meta.txt
          # 本机判断"到底验没验"的依据：缺 runtime 时一条断言都没跑，
          # 只看 test_ok=0 会误读成"测试通过"。
          echo "test_executed=${{ steps.golden.outputs.test_executed }}" >> /tmp/citest/meta.txt
          echo "tests_executed=$(grep -cE "Test Case .* passed|Test Case .* failed" /tmp/citest/test.log 2>/dev/null || echo 0)" >> /tmp/citest/meta.txt

          cd /tmp/citest
          git init -q .
          git checkout -q -b ci-test
          git config user.name ci
          git config user.email ci@local
          git add -A && git commit -q -m "ci test log run=$GITHUB_RUN_ID" || true
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-test || true

  # ================= 真编译 =================
  build:
    name: 编译（iOS 27 SDK）
    runs-on: xcode-27
    # 2026-11-04（目标：构建等待 ≤30s）：**摘掉 `needs: gates`**。
    # 实测（run a3b35e92）：push 后 +3s 闸门启动，+63s 编译才启动 ——
    # 其中 51s 是闸门自己跑完的时间。要"推送后 30 秒内开始构建"，唯一的路是并行。
    # 代价（如实记录）：源码有硬错时，会白跑一次编译（约 6 分钟）才拿到闸门的结论。
    # 收益：编译与闸门同时开始，+3s 即进入编译；闸门红时 run 仍然红（见下方 verify-gate 步骤）。
    # 不是"跳过闸门"—— 闸门照跑，只是不再**阻塞**编译。
    # G-11：xcode-27 是 preview 镜像，历史上抽风过（见文件头注释）。
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 环境信息
        run: |
          xcodebuild -version
          xcode-select -p

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成工程
        run: |
          xcodegen generate
          ls -la
          test -d LockKeeper.xcodeproj || { echo "::error::XcodeGen 没有生成 LockKeeper.xcodeproj"; exit 1; }
          # 构建号链路自检：只看不改。Info.plist 由 XcodeGen 生成，本机没有 xcodegen 无法预演它的
          # 输出格式（XML/二进制），所以这里只发警告，绝不因为自检本身把 build job 弄红。
          if ! grep -q "CFBundleVersion" App/Info.plist; then
            echo "::warning::Info.plist 里没有 CFBundleVersion（构建号可能没进包）"
          elif ! grep -A1 CFBundleVersion App/Info.plist | grep -q "CURRENT_PROJECT_VERSION"; then
            echo "::warning::CFBundleVersion 不是构建设置引用，构建号注入可能失效"
          else
            echo '构建号链路：CFBundleVersion = 构建设置引用，由 xcodebuild 在打包时展开'
          fi

      - name: 编译（整模块单次调用，一次列出全仓所有 error）
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild build \
            -project LockKeeper.xcodeproj \
            -scheme LockKeeper \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -configuration Debug \
            SWIFT_COMPILATION_MODE=wholemodule \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tee build/build.log


      - name: Archive（出可安装的未签名 IPA）
        run: |
          set -o pipefail
          xcodebuild archive \
            -project LockKeeper.xcodeproj \
            -scheme LockKeeper \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/LockKeeper.xcarchive \
            SWIFT_COMPILATION_MODE=wholemodule \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tee build/archive.log
          mkdir -p build/Payload
          cp -R "build/LockKeeper.xcarchive/Products/Applications/LockKeeper.app" build/Payload/
          # 文件名带上构建时刻 + 运行号 + commit 短哈希（G-14）。
          # 只带时刻的话，拿到一个 ipa 无法反查它是哪个 commit 出的 —— 装错版本比不装更糟，
          # 而"这包是哪次构建"恰恰是排查"我明明推了修复却没生效"的第一现场证据。
          STAMP=$(TZ=Asia/Shanghai date +%Y%m%d.%H%M%S)
          SHORT=$(git rev-parse --short=7 HEAD)
          NAME="LockKeeper-$STAMP-r${{ github.run_number }}-$SHORT-unsigned.ipa"
          echo "IPA 名称: $NAME"
          cd build && zip -qry "$NAME" Payload
          ls -lh LockKeeper-*-unsigned.ipa

      - name: 编译失败时把错误行转成注解（不登录也能读）
        if: failure()
        run: |
          for L in build/build.log build/archive.log; do
            [ -f "$L" ] || continue
            grep -E "error: " "$L" | sed "s#^#::error file=ios27/$L::#" || true
          done
          {
            echo "## 编译错误摘录（全量，去重）"
            if grep -hE "error: " build/build.log build/archive.log 2>/dev/null | sed -E 's#^/[^ ]*/##' | sort -u; then
              :
            else
              echo "（日志里没有 error: 行 —— 那多半是环境/签名问题，不是源码）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布到 Release（公开直链下载 IPA）
        # G-02：只在 main 的 push 上发布。PR（尤其 fork PR）不得改写公开 Release，
        # 也不该因为 token 只读而把整条 build job 弄红。
        if: github.event_name == 'push' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          IPA=$(ls build/LockKeeper-*-unsigned.ipa | head -1)
          echo "IPA: $IPA"
          NOTE="离线锁管家 iOS 27 · 未签名 IPA（用 AltStore / Sideloadly 自签后安装）"
          NOTE="$NOTE"$'\n'"构建: ${{ github.sha }}（run #${{ github.run_number }}）"
          NOTE="$NOTE"$'\n'"产物: $(basename "$IPA")"
          if ! gh release view ios27-latest >/dev/null 2>&1; then
            gh release create ios27-latest --title "iOS 27 · 最新构建" --notes "$NOTE" --prerelease
          fi
          # 只留最新一个 IPA：安装台上堆多份「看起来都一样」的包，装错版本比不装更糟。
          # 先删旧资产，再上传新的。注意管道里 grep 无匹配时不能因 set -e 让整步失败。
          OLD=$(gh release view ios27-latest --json assets --jq '.assets[].name' 2>/dev/null | grep -E '\.ipa$' || true)
          for old in $OLD; do
            gh release delete-asset ios27-latest "$old" -y || true
          done
          gh release upload ios27-latest "$IPA"
          gh release edit ios27-latest --notes "$NOTE"

      - name: 失败时把日志挂到 Release（公开可读，用于无鉴权排查）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p build
          for f in build/build.log build/archive.log; do
            [ -f "$f" ] && cp "$f" "build/$(basename "$f" .log)-run${{ github.run_id }}.log"
          done
          if ! gh release view ios27-diag >/dev/null 2>&1; then
            gh release create ios27-diag --title "ios27 构建诊断" --notes "失败构建的日志（自动发布）" --prerelease || true
          fi
          for f in build/*-run${{ github.run_id }}.log; do
            [ -f "$f" ] && gh release upload ios27-diag "$f" --clobber
          done
          # 没有日志文件时也留一条，避免"看不到"被误读成"没失败"
          if ! ls build/*-run${{ github.run_id }}.log >/dev/null 2>&1; then
            echo "本次失败没有产生 build.log / archive.log（多半红在更早的步骤）" > build/note-run${{ github.run_id }}.txt
            gh release upload ios27-diag "build/note-run${{ github.run_id }}.txt" --clobber || true
          fi

      - name: 上传编译日志 + IPA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios27-build
          path: |
            ios27/build/build.log
            ios27/build/archive.log
            ios27/build/LockKeeper-*-unsigned.ipa
          if-no-files-found: ignore

      - name: 发布构建日志到 ci-log 分支（供本地无网络时排查）
        # G-02：ci-log 是 force-push 的孤儿分支，PR 不许推它（否则任何 PR 都能改写排查基线）。
        if: github.event_name == 'push' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p /tmp/ciout
          [ -f build/build.log ] && cp build/build.log /tmp/ciout/build.log
          [ -f build/archive.log ] && cp build/archive.log /tmp/ciout/archive.log
          grep -E "error:" build/build.log 2>/dev/null | sed "s|.*/ios27/||" | sort -u > /tmp/ciout/errors.txt
          grep -E "error:" build/archive.log 2>/dev/null | sed "s|.*/ios27/||" | sort -u >> /tmp/ciout/errors.txt
          echo "commit=$(git rev-parse HEAD)" > /tmp/ciout/meta.txt
          echo "run=$GITHUB_RUN_ID" >> /tmp/ciout/meta.txt
          echo "job=$GITHUB_JOB" >> /tmp/ciout/meta.txt
          echo "errors=$(wc -l < /tmp/ciout/errors.txt 2>/dev/null || echo 0)" >> /tmp/ciout/meta.txt
          # errors=0 只说明**编译**没有 error 行 —— 它不等于 job 绿。
          # 测试步骤失败时 archive 不会跑（archive.log 根本不存在），而 errors 仍是 0。
          # 所以把每一步的产物与结论都记下来，让本地能独立判断"到底绿没绿"。
          # 2026-11-01：`build_log=no` 时本地只能猜"红在更早的步骤"（xcodegen/brew/checkout）。
          # 把**工程是否生成**与**源码文件数**也记进来 —— 一眼能分开"xcodegen 挂了"与"根本没 checkout 到"。
          echo "project=$([ -d LockKeeper.xcodeproj ] && echo yes || echo no)" >> /tmp/ciout/meta.txt
          echo "swift_files=$(find App -name "*.swift" 2>/dev/null | wc -l | tr -d " ")" >> /tmp/ciout/meta.txt
          echo "build_log=$([ -f /tmp/ciout/build.log ] && echo yes || echo no)" >> /tmp/ciout/meta.txt
          echo "archive_log=$([ -f /tmp/ciout/archive.log ] && echo yes || echo no)" >> /tmp/ciout/meta.txt
          echo "build_ok=$(grep -c "BUILD SUCCEEDED" /tmp/ciout/build.log 2>/dev/null || echo 0)" >> /tmp/ciout/meta.txt
          echo "archive_ok=$(grep -c "ARCHIVE SUCCEEDED" /tmp/ciout/archive.log 2>/dev/null || echo 0)" >> /tmp/ciout/meta.txt
          # 2026-11-01：把**源码告警数**也记进来。此前只记 errors/build_ok/archive_ok，
          # 于是「build.log 里有 6 条 warning」这件事从来没人看 —— 而其中一条是真缺陷
          # （AppLock 的 return 之后有死代码，刷脸成功永不清冷却）。
          # 口径：只数源码告警行（路径以 App/ 开头），排除 Xcode 回显（"| ... warning:"）与工具提示。
          echo "warnings=$(grep -cE "^/Users/runner/work/ios-app/ios-app/ios27/App/.*: warning:" /tmp/ciout/build.log 2>/dev/null || echo 0)" >> /tmp/ciout/meta.txt
          cd /tmp/ciout
          git init -q .
          git checkout -q -b ci-log
          git config user.name ci
          git config user.email ci@local
          git add -A
          git commit -q -m "ci log $GITHUB_RUN_ID" || true
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log || true

  # ================= 闸门结论（把 gates 的结果重新变成"整条 run 的判据"）=================
  # 2026-11-04（目标：构建等待 ≤30s）：build 与 gates 现在是**并行**的（build 不再 needs: gates），
  # 所以 gates 失败**不会**自动让 run 变红 —— 那样就成了"为了快而跳过闸门"。
  # 这个 job 把 gates 的结论重新接回 DAG：gates 红 ⇒ 它红 ⇒ 整条 run 红。
  # 它只做判断，不重复跑闸门（gates 已经跑过），所以耗时是秒级。
  verify-gate:
    name: 闸门结论（并行编译的配套）
    runs-on: ubuntu-latest
    needs: gates
    timeout-minutes: 5
    # 本 workflow 顶层有 defaults.run.working-directory: ios27，而本 job **不 checkout**
    # （它只读 needs 的结论），那个目录因此不存在 —— 第一次跑就报
    # "An error occurred trying to start process /usr/bin/bash with working directory ...".
    # 显式清空工作目录，让它在仓库根跑。
    defaults:
      run:
        working-directory: .
    steps:
      - name: 确认静态闸门通过
        run: |
          echo "静态闸门结果: ${{ needs.gates.result }}"
          if [ "${{ needs.gates.result }}" != "success" ]; then
            echo "::error::静态闸门未通过 —— 编译即使成功也不能算绿（见 allgates 日志）"
            exit 1
          fi
          echo "静态闸门通过；编译已在并行进行（不再被闸门阻塞）"

  # ================= 真机截图（供本地无 Xcode 时"看见"界面）=================
  # 开发机是 Windows，没有 Xcode / 模拟器 —— 这是唯一能拿到**真实渲染**的途径。
  # 用 simctl 直接截屏，不需要 UI Test target（不改工程结构，坏了也不会拖垮编译）。
  # continue-on-error: 截图是诊断能力，不能因为它失败就把整条流水线弄红。

  # 2026-11-03：截图**合并回主 workflow**（拆成独立文件后 ci-shots 再没更新过）。
  # 2026-11-05 起不再排在 build 之后 —— 见下面的 changes / shots 两段说明。
  # ================= 判断"这次推送值不值得截图" =================
  # 2026-11-05（用户建议：跑截图的很占时间，能怎么优化下）：
  # 截图 job 是整条流水线的长杆 —— 要单独编译一次模拟器包，再 30 次
  # 「terminate + launch + sleep + screenshot」，一轮 20 分钟以上；
  # 而它排在 build 之后，等于把 run 的总时长从 ~15 分钟拉到 ~35 分钟。
  #
  # 优化一（本 job）：**只有动到界面层才截图**。逻辑/闸门/文档类提交从源码上就不可能
  # 改变渲染结果，为它们跑 30 张图是纯浪费。判据用路径前缀，不是"猜"。
  changes:
    name: 变更范围（决定要不要截图）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      ui: ${{ steps.scope.outputs.ui }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Checkout（需要历史才能 diff）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 判断是否动到界面层
        id: scope
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"; echo "手动触发：总是截图"; exit 0
          fi
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "ui=true" >> "$GITHUB_OUTPUT"; echo "没有可比基线（新分支或强推）：按有改动处理"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" || true)
          echo "本次改动文件数: $(printf '%s\n' "$CHANGED" | grep -c . || true)"
          # 界面层的判据：页面 / 设计系统 / 外壳 / App 入口 / 截图种子
          # 2026-11-05：把「截图驱动本身」也算进触发条件 —— 改了驱动却不跑截图，
          # 等于永远不知道驱动还能不能用（本轮就撞上：只改 workflow/驱动 ⇒ 截图被 skip）。
          if ! printf '%s\n' "$CHANGED" | grep -qE '^ios27/(App/(Features|Design|Shell)/|App/LockKeeperApp\.swift|\.github-seed/|Tools/shots_driver\.py)'; then
            echo "ui=false" >> "$GITHUB_OUTPUT"; echo "scope=all" >> "$GITHUB_OUTPUT"
            echo "只动了非界面文件 → 跳过截图"; exit 0
          fi
          echo "ui=true" >> "$GITHUB_OUTPUT"
          # 2026-11-05（用户建议 · 优化五）：**只截改动所在的域**。
          # 设计系统/外壳/App 入口/种子动了 ⇒ 影响所有页面，截全套；
          # 否则按 Features 下的域收敛到对应的 Tab + 子页。
          if printf '%s\n' "$CHANGED" | grep -qE '^ios27/(App/(Design|Shell)/|App/LockKeeperApp\.swift|\.github-seed/|Tools/shots_driver\.py)'; then
            echo "scope=all" >> "$GITHUB_OUTPUT"; echo "动到设计系统/外壳/种子 → 截全套"; exit 0
          fi
          FEAT=$(printf '%s\n' "$CHANGED" | grep '^ios27/App/Features/' | sed -E 's#^ios27/App/Features/([^/]+)/.*#\1#' | sort -u)
          echo "改动域: $(echo $FEAT)"
          case "$FEAT" in
            Door)      S=door ;;
            Keys)      S=keys ;;
            Records)   S=records ;;
            Household) S=household ;;
            Settings)  S=settings ;;
            *)         S=all ;;   # 跨域或无法识别 → 全套
          esac
          echo "scope=$S" >> "$GITHUB_OUTPUT"; echo "截图范围: $S"

  shots:
    name: 模拟器截图（诊断用）
    runs-on: xcode-27
    # 2026-11-05（优化二）：不再 needs: build —— 与编译**并行**开始。
    # 之前排在 build（约 15 分钟）之后，图片要等编译完才开始产出；
    # 并行后 wall-clock 从 build+shots 变成 max(build, shots)，图片早到约 15 分钟。
    # 代价如实记录：会多一次模拟器架构的编译（build job 那份是 device 架构，装不进模拟器）。
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    continue-on-error: true
    env:
      # 只有这一域动过时，只截这一域（all = 全套）。判据见 changes job。
      SCOPE: ${{ needs.changes.outputs.scope }}
    # 2026-11-04（实测）：40 分钟装不下。这个 job 要跑 5 个主 Tab + 5 张整页 +
    # 10 个子页 + 10 张子页整页 = 30 次「terminate + launch + sleep + screenshot」，
    # 而每次冷启动在 runner 上要 5–8 秒。上一轮 diag 停在 `4-settings`、count=10 ——
    # 不是产品问题，是**这个 job 被 40 分钟上限杀在半路**。提到 70 分钟。
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: 安装 XcodeGen
        run: brew install xcodegen || true
      - name: 生成工程
        run: xcodegen generate
      - name: 选一个可用模拟器
        id: sim
        run: |
          set -e
          LINE=$(xcrun simctl list devices available | grep -m1 "iPhone" || true)
          echo "$LINE"
          DEV=$(echo "$LINE" | grep -oE "[0-9A-Fa-f-]{36}" | head -1)
          echo "udid=$DEV" >> "$GITHUB_OUTPUT"
          test -n "$DEV"
      - name: 编译到模拟器
        run: |
          set -o pipefail
          xcodebuild build -project LockKeeper.xcodeproj -scheme LockKeeper \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/Sim -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tail -40
      - name: 逐 Tab 截图
        run: |
          set +e
          mkdir -p /tmp/shots
          DIAG=/tmp/shots/diag.txt
          : > "$DIAG"
          echo "udid=${{ steps.sim.outputs.udid }}" >> "$DIAG"
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find build/Sim/Build/Products -name "LockKeeper.app" -maxdepth 3 | head -1)
          echo "APP=${APP:-<not found>}" >> "$DIAG"
          echo "APP=$APP"
          # 2026-11-04（diag 取证）：上一轮 diag 只写到 APP 那一行就断了 —— 说明卡在 boot/bootstatus，
          # 而这两句原本是 `|| true`，卡住时既不报错也不留痕，整个 job 被 40 分钟超时杀掉。
          # 给 bootstatus 一个有界等待，并逐段留痕。
          # 2026-11-04（外观取证）：CI 模拟器默认**深色** —— `V.C.bg` 深色档是纯黑，
          # 于是 full 截图左侧黑边、分组标题（text3 深灰）在黑底上不可见，
          # 而产品的默认/推荐外观是浅色（契约纸色）。截图前钉成浅色，与视觉验收基准一致。
          echo "stage=boot" >> "$DIAG"
          # 2026-11-04（第 5 次修正 · 消除 Booting 态歧义）：上一版 for 循环只认 `Booted`，
          # 而模拟器在 `Booting`（启动中）状态时 grep 得到行但不匹配，36×5s 内一直 Booting
          # 就会 exit 1 —— 这次 run 的 diag 正是停在这里。改法：
          #   ① boot 前先 `simctl shutdown`（幂等，已关机报错无所谓）—— 消掉"已 Booted"的 405 歧义；
          #   ② 轮询用状态**字段**判定（行尾 (Booted)），Boot/Booting 都继续等；
          #   ③ 上限从 180s 提到 300s（冷启动慢的 runner 也装得下）。
          xcrun simctl shutdown "$UDID" >> "$DIAG" 2>&1 || true
          xcrun simctl boot "$UDID" >> "$DIAG" 2>&1 || true
          BOOTED=0
          for _ in $(seq 1 60); do
            STATE=$(xcrun simctl list devices | grep "$UDID" | head -1 || true)
            case "$STATE" in
              *"(Booted)"*) BOOTED=1; break ;;
            esac
            sleep 5
          done
          if [ "$BOOTED" != "1" ]; then
            echo "boot=NOT_BOOTED_AFTER_180s" >> "$DIAG"
            xcrun simctl list devices >> "$DIAG" 2>&1 || true
            # 2026-11-05：截图是**诊断能力**，boot 失败也只是这一轮没有图 —— 不该把整步判死。
            # 收口成 exit 0（有 count 判据兜底：没有图会由末尾的 COUNT 检查报出来）。
            echo "::warning::模拟器没有在 300 秒内进入 Booted —— 本轮跳过截图"
            exit 0
          fi
          echo "boot=ok (already-or-now Booted)" >> "$DIAG"
          # 2026-11-04（第二次修正）：appearance 必须在 boot **之后** —— 关机状态下
          # `simctl ui` 报 405 Shutdown，被我 `|| true` 吞掉，上一轮因此没生效。
          xcrun simctl ui "$UDID" appearance light >> "$DIAG" 2>&1
          echo "appearance=light" >> "$DIAG"
          echo "bootstatus=ok" >> "$DIAG"
          if ! xcrun simctl install "$UDID" "$APP" >> "$DIAG" 2>&1; then
            echo "install=FAILED" >> "$DIAG"
            echo "::warning::装不进模拟器（APP=$APP）—— 本轮跳过截图"
            ls -la "$(dirname "$APP")" >> "$DIAG" 2>&1 || true
            exit 0
          fi
          echo "install=ok" >> "$DIAG"
          echo "stage=first-shot" >> "$DIAG"
          # 立刻验一张：装上了但截不出图 = 模拟器显示服务没起来，与"页面空白"是两回事。
          #
          # 2026-11-05（实测）：连续两轮 diag 都停在 `stage=first-shot` 就断了 ——
          # 探针截图是**第一次**调用 simctl io，模拟器显示服务常常还没就绪。
          # 原来一次失败就 exit 1，整步判死、一张图都没有。
          # 现在：最多试 5 次、每次间隔 3 秒；仍失败也只是**降级**（记录并继续），
          # 让后面的循环去试 —— 后面每一张自己也有重试。
          PROBE_OK=0
          for attempt in 1 2 3 4 5; do
            if xcrun simctl io "$UDID" screenshot "/tmp/shots/_probe.png" >> "$DIAG" 2>&1 && [ -f "/tmp/shots/_probe.png" ]; then
              PROBE_OK=1; break
            fi
            echo "probe-shot=retry$attempt" >> "$DIAG"
            sleep 3
          done
          if [ "$PROBE_OK" = "1" ]; then
            echo "probe-shot=ok" >> "$DIAG"
            rm -f "/tmp/shots/_probe.png"
          else
            echo "probe-shot=FAILED_ALL_5" >> "$DIAG"
            echo "::warning::探针截图 5 次都失败 —— 继续尝试正式截图（每张自带重试）"
          fi
          # 预授权系统弹窗 —— 否则第一次启动的通知权限对话框会挡住截图（13 号截图实测被挡）。
          xcrun simctl privacy "$UDID" grant notifications com.aapk.lockkeeper 2>/dev/null || true
          xcrun simctl privacy "$UDID" grant user_tracking com.aapk.lockkeeper 2>/dev/null || true
          xcrun simctl privacy "$UDID" grant localnetwork com.aapk.lockkeeper 2>/dev/null || true
          xcrun simctl spawn "$UDID" defaults write com.aapk.lockkeeper NSUserNotificationUsageDescriptionIsUseless -bool YES 2>/dev/null || true
          mkdir -p /tmp/shots
          # 合成数据（kf-bundle 格式）：让刻度盘/凭证卡/时间线有东西可渲染。
          # 文件在仓库 .github-seed/，PIN/skey 全部合成，不含真密钥。
          SEED_SRC="$GITHUB_WORKSPACE/ios27/.github-seed/kf-seed.json"
          APPDATA=$(xcrun simctl get_app_container "$UDID" com.aapk.lockkeeper data 2>/dev/null || true)
          if [ -n "$APPDATA" ] && [ -f "$SEED_SRC" ]; then
            mkdir -p "$APPDATA/Documents"
            cp "$SEED_SRC" "$APPDATA/Documents/kf-seed.json"
            echo "seed placed at $APPDATA/Documents/kf-seed.json"
          fi
          # 2026-11-04（取证）：种子日志到底写没写进去 —— App 侧会落一个 kf-seed-diag.txt，
          # 这里在**第一次启动之后**读一次，写进 diag。缺了这行，记录页空白时无从判断是"没写"还是"没读"。
          SEEDDIAG=$(xcrun simctl get_app_container "$UDID" com.aapk.lockkeeper data 2>/dev/null || true)
          # 2026-11-05（截图耗时优化）：这里原来还有一轮「5 个 Tab 的**视口**截图」
          # （含每张最多 3 次空白重拍）。整页截图已经把每一屏的首屏内容一并包含，
          # 而视口图与整页图在评审时看的是同一件事 —— 5 次冷启动 + 最多 15 次重拍全是浪费。
          # 整页图见下面的循环（-kfFullPage）。
          echo "skip=tab-viewport-shots (covered by full-page)" >> "$DIAG"
          # 2026-11-04（视觉盲区）：记录列表在首屏之下 —— 视口截图止于「最近事件」，
          # 整页截图又被 LazyVStack 吞掉（没滚到的行不 materialize）。于是**列表本身
          # 从来没被看见过**。`-kfScroll` 让根页 ScrollView 以底部为锚（App 侧
          # `UITestScrollBottom`，记录页已挂），补一张滚到底的截图。
          xcrun simctl terminate "$UDID" com.aapk.lockkeeper 2>/dev/null || true
          xcrun simctl launch "$UDID" com.aapk.lockkeeper -kfUITest -kfSeed -kfScroll -kfTab 2 || true
          sleep 5
          xcrun simctl io "$UDID" screenshot "/tmp/shots/2-records-bottom.png" >> "$DIAG" 2>&1 || true
          if [ -f "/tmp/shots/2-records-bottom.png" ]; then
            echo "shot 2-records-bottom=ok size=$(stat -f%z /tmp/shots/2-records-bottom.png)" >> "$DIAG"
          else
            echo "shot 2-records-bottom=missing" >> "$DIAG"
          fi
          # 第一轮启动后读种子取证文件（此时 App 已导入过一次）
          SEEDDIAG=$(xcrun simctl get_app_container "$UDID" com.aapk.lockkeeper data 2>/dev/null || true)
          if [ -n "$SEEDDIAG" ] && [ -f "$SEEDDIAG/Documents/kf-seed-diag.txt" ]; then
            echo "--- seed-diag ---" >> "$DIAG"
            cat "$SEEDDIAG/Documents/kf-seed-diag.txt" >> "$DIAG"
          else
            echo "--- seed-diag missing ---" >> "$DIAG"
          fi
          # 2026-11-04（取证 · 第二轮）：记录页那一屏实际读到几条（App 侧 append）。
          if [ -n "$SEEDDIAG" ] && [ -f "$SEEDDIAG/Documents/kf-records-diag.txt" ]; then
            echo "--- records-diag ---" >> "$DIAG"
            cat "$SEEDDIAG/Documents/kf-records-diag.txt" >> "$DIAG"
          else
            echo "--- records-diag missing ---" >> "$DIAG"
          fi
          # 整页截屏（**算法级**，不是滚到底）：App 把 ScrollView 的 frame 临时撑到
          # contentSize 高度后一次成像，中间内容不会漏。产物落在 App 容器 Documents/，
          # 这里用 simctl get_app_container 拷出来，命名 <i>-<name>-full.png。
          # 2026-11-05（优化五）：Tab 与子页都按 changes.scope 收敛 —— 单域改动只截那一域。
          # 2026-11-05（实测重构）：tab/子页两轮截图交给 Tools/shots_driver.py。
          # 内联 bash 在这套 runner 上反复「打印了 scope 行就再没有下文」（连一条
          # fullpage 记录都没有），而 heredoc 里的 Python 会因 YAML 缩进被判 IndentationError。
          # 独立脚本至少能本地 py_compile、能 diff、能一眼看出停在哪张图。
          python3 Tools/shots_driver.py "$UDID" "$SCOPE" "$DIAG"
          # 2026-11-05（截图耗时优化）：这里原来还有一轮「10 个子页的整页截图」。
          # diag 里自己写着：单屏页面 content.height 不超过视口 +50 时 App 不产出整页图 ——
          # 也就是 10 次里大多数注定拿不到文件，只换来 10 次冷启动（每次 8 秒 sleep）。
          # 子页的**视口**截图仍在上一轮循环里产出，评审要看的内容不丢。
          echo "skip=subpage-fullpage-shots (App does not emit on single-screen pages)" >> "$DIAG"
          ls -la /tmp/shots
          # 2026-11-05（诊断）：本 step 在 run 41947680856 上标了 failure，但 diag 显示它跑到了
          # 最后一段、且产出了 2-records-bottom.png —— 说明中途某个非零退出码把 step 判红了。
          # 这个 step 是**诊断用**的（job 本身 continue-on-error），所以明确收口：
          # 有图就算成功，一张都没有才算失败 —— 这样红/绿仍然有意义，不再被无关的退出码污染。
          COUNT=$(ls /tmp/shots/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$DIAG"
          if [ "$COUNT" -ge 1 ]; then
            echo "截图产出 $COUNT 张"
            exit 0
          fi
          echo "::error::一张截图都没有产出（见 ci-shots 分支的 diag）"
          exit 1
      - name: 空白页检测（整页单色 = 页面卡死/崩溃）
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, sys
          try:
              from PIL import Image, ImageStat
          except Exception as e:
              print("PIL 不可用，跳过空白检测:", e); sys.exit(0)
          # 2026-11-04（实测漏报）：`4-settings.png` 是纯白（mean=255,stddev=10.8，只剩状态栏），
          # 而原阈值 `stddev < 6` 判它"有内容" —— **状态栏本身就贡献了 ~10 的 stddev**。
          # 两处修正：① 先裁掉顶部状态栏与底部 home 条，只量内容区；② 阈值提到 8。
          bad = []
          for f in sorted(glob.glob("/tmp/shots/*.png")):
              try:
                  raw = Image.open(f).convert("RGB")
                  w, h = raw.size
                  top, bottom = int(h * 0.09), int(h * 0.94)
                  im = raw.crop((0, top, w, bottom)).resize((64, 128))
                  st = ImageStat.Stat(im)
                  spread = max(st.stddev)
                  if spread < 8:
                      bad.append((os.path.basename(f), round(spread, 2)))
              except Exception as e:
                  bad.append((os.path.basename(f), "unreadable"))
          if bad:
              print("::warning::疑似空白页（整页单色，页面可能卡死/崩溃）：")
              for name, v in bad:
                  print(f"  {name}  stddev={v}")
              with open("/tmp/shots/blank-report.txt", "w") as fh:
                  fh.write("\n".join(f"{n}\t{v}" for n, v in bad))
          else:
              print("空白检测通过：所有截图都有内容")

          # 2026-11-04：**空白页检测只抓「整页单色」**，抓不到"标题画了、内容没画"这种
          # 半空白 —— 快捷操作那一块就是 726px 的纯背景带，整页 stddev 仍然正常。
          # 这里加一条：整页截图里连续 >=400px 的行完全无墨迹 ⇒ 打印出来（不 fail，作为线索）。
          bands_found = 0
          for f in sorted(glob.glob("/tmp/shots/*-full.png")):
              try:
                  im = Image.open(f).convert("RGB")
                  w, h = im.size
                  bg = im.getpixel((5, h // 2))
                  def rowink(y):
                      n = 0
                      for x in range(0, w, 6):
                          px = im.getpixel((x, y))
                          if abs(px[0]-bg[0]) + abs(px[1]-bg[1]) + abs(px[2]-bg[2]) > 30:
                              n += 1
                      return n
                  start = None
                  for y in range(0, h, 8):
                      if rowink(y) < 2:
                          if start is None: start = y
                      else:
                          if start is not None and y - start >= 400:
                              print(f"::warning::{os.path.basename(f)} 有 {y-start}px 连续空白带 (y={start}..{y})")
                              bands_found += 1
                          start = None
                  if start is not None and h - start >= 400:
                      print(f"::warning::{os.path.basename(f)} 末尾 {h-start}px 空白 (y={start}..{h})")
                      bands_found += 1
              except Exception as e:
                  print("band scan skipped", f, e)
          # 2026-11-05（Round 67）：**横向溢出检测**。
          # 内容比屏幕宽时整页会被左右裁切 —— 闸门不做布局计算、编译看不出、人眼要放大才看得见。
          # 判据：最左一列（x=1）深色行占比 > 2%。
          # 标定：锁设置页（已知溢出）8.0%；其余 14 张子页截图 0.1%。
          clipped = []
          for f in sorted(glob.glob("/tmp/shots/*.png")):
              try:
                  im = Image.open(f).convert("RGB")
                  w, h = im.size
                  rows = list(range(0, h, 3))
                  dark = 0
                  for y in rows:
                      px = im.getpixel((1, y))
                      if px[0] < 120 and px[1] < 120 and px[2] < 120:
                          dark += 1
                  ratio = dark / max(1, len(rows))
                  if ratio > 0.02:
                      clipped.append((os.path.basename(f), round(ratio * 100, 1)))
              except Exception as e:
                  print("clip scan skipped", f, e)
          if clipped:
              print("::warning::疑似横向溢出（左侧文字贴边，整页可能被裁）：")
              for name, pct in clipped:
                  print(f"  {name}  {pct}%")
          else:
              print("横向溢出检测通过：没有页面左侧贴边")
          print(f"空白带扫描完成：{bands_found} 处")
          PY

      - name: 推到 ci-shots 分支
        if: github.event_name == 'push' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cd /tmp/shots || exit 0
          echo "commit=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" > meta.txt
          echo "run=$GITHUB_RUN_ID" >> meta.txt
          echo "count=$(ls *.png 2>/dev/null | wc -l | tr -d ' ')" >> meta.txt
          # 2026-11-03：count=0 时 meta 里只有一个"0"，无法判断是没找到 App、装不上、还是截图空。
          # 把截图步骤的诊断一并写进来。
          if [ -f diag.txt ]; then
            echo "--- diag ---" >> meta.txt
            head -40 diag.txt >> meta.txt
          fi
          # 2026-11-05（实测）：**空产出不许覆盖已有的图**。
          # 这一轮就撞上了：一次被取消的 run 只产出了 diag/meta，然后 force-push 把上一次
          # 完整的 16 张图整个盖掉 —— ci-shots 变成只剩两个 txt。截图是诊断资产，
          # 用空集覆盖好集是纯粹的倒退。
          COUNT=$(ls *.png 2>/dev/null | wc -l | tr -d ' ')
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "::warning::本轮 0 张截图 —— 保留 ci-shots 上的旧图，不做 force-push"
            echo "skip publish: count=0 (keeping previous screenshots)"
            exit 0
          fi
          # 2026-11-05（实测 · 部分产出也会缩水）：上一轮被取消时只拍了 6 张，
          # 发布后把原来 16 张的集合换成了 6 张 —— 没重拍的页就消失了。
          # 截图应当**只增不减**：先把旧图取回来，本轮没产出的那份补上，再发布。
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git clone -q --depth 1 --branch ci-shots "$REMOTE" /tmp/prev 2>/dev/null; then
            KEPT=0
            for f in /tmp/prev/*.png; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              if [ ! -f "$base" ]; then cp "$f" "$base"; KEPT=$((KEPT + 1)); fi
            done
            echo "merged $KEPT previous screenshot(s) that this run did not re-shoot"
            # 2026-11-05（截图可信度）：旧命名是「两位序号-页面名」（如 10-lockSettings.png），
            # 序号随 scope 变化 ⇒ 同一页面会以多个文件名长期共存，看图的无法判断哪张是新的。
            # 现在子页改用稳定名（lockSettings.png），这里把旧命名的残留清掉。
            # Tab 整页图是「一位序号-名字-full.png」（0-door-full.png），不受影响。
            REMOVED=$(ls [0-9][0-9]-*.png 2>/dev/null | wc -l | tr -d " ")
            rm -f [0-9][0-9]-*.png
            echo "removed $REMOVED stale index-prefixed screenshot(s)"
          else
            echo "no previous ci-shots to merge (first publish?)"
          fi
          COUNT=$(ls *.png 2>/dev/null | wc -l | tr -d ' ')
          git init -q .
          git checkout -q -b ci-shots
          git config user.name ci
          git config user.email ci@local
          git add -A
          git commit -q -m "ci shots $GITHUB_RUN_ID (${COUNT} images)" || true
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots || true

  # ================= Android APK（与 iOS 并行构建）=================
  # 2026-11-03：用户要求「同时构建 android」。只做构建与产物上传，
  # 不搬旧 ios.yml 里那 18 个 Kotlin 静态闸门（它们的脚本已随旧工具链归档，
  # 且属于旧审计体系；需要时从 _archive/ios-app-legacy/tools/ 取回再接）。
  android:
    name: Build (Android 13+, APK)
    runs-on: ubuntu-latest
    # 2026-11-04（目标：构建等待 <=30s）：与 iOS 同样摘掉 needs: gates。
    # Android 也等了 62s（51s 是闸门）。并行后 +3s 即开始；闸门结论由 verify-gate 兜住。
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 的 ubuntu 镜像自带 Android SDK（$ANDROID_HOME 已设、licenses 已接受）
      - name: 确认镜像自带 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: 编译 APK (debug, 可直接安装)
        working-directory: android-app
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 编译失败时输出错误摘要
        if: failure()
        working-directory: android-app
        run: |
          echo "## Android 编译错误" >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |error:" build.log | head -40 >> $GITHUB_STEP_SUMMARY || true

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: KfKey-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
