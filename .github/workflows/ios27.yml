# ios27 云编译 —— 全新 iOS 27 App 的闸门 + 编译
#
# 镜像: `xcode-27`（Public preview, macOS 27 arm64）—— 带 iOS 27.0/27.1/27.2 SDK。
#   与仓库里既有的 ios.yml 同一个镜像；它抽风时把 runs-on 改回 macos-latest 即可。
#
# 为什么需要云端：开发机是 Windows，没有 Xcode，也没有 iOS 模拟器。
# 本地能跑的是 20 道静态闸门 + DesignLab 截图；真编译只能在这里做。
#
# 关键技巧（从既有 ios.yml 学来的）：SWIFT_COMPILATION_MODE=wholemodule
#   默认增量模式下一个文件失败就停，只能一轮挤一个错。整模块单次调用会把**全仓所有** error
#   一次列出来 —— 这个 App 还没在真编译器上跑过，第一轮大概率有一批，必须一次看全。
name: ios27

on:
  push:
    branches: [main, master]
    paths:
      - "ios27/**"
      - ".github/workflows/ios27.yml"
  pull_request:
    paths:
      - "ios27/**"
      - ".github/workflows/ios27.yml"
  workflow_dispatch:

# 2026-11-03：**队列控制**。之前每个 push 都排一整套（gates+golden+build+shots，约 13-20 分钟），
# 连续几次提交就把队列堆到一小时。同一个分支只保留最新一次：新 push 到达时取消还在跑的旧 run。
# 产物（IPA/截图）由新 run 重新产出；ci-shots 是独立分支，不受取消影响。
concurrency:
  group: ios27-${{ github.ref }}
  # 2026-11-03 实测两种策略的代价：
  #   · cancel: true  → 连续推送时截图被打断，ci-shots 跨 8 个提交零更新；
  #   · cancel: false → 每个提交跑完整 run（约 25 分钟），4 个提交 = 100 分钟才轮到最新代码。
  # 结论：**队列不能无限堆积**。恢复 cancel: true，靠"降低推送频率"解决截图被打断
  # —— 一个轮次只推一次，让每次 run 有 25 分钟跑完。
  cancel-in-progress: true

permissions:
  # Release 资产是公开直链可下载的；artifact 下载要登录，所以 IPA 必须挂 Release。
  contents: write

defaults:
  run:
    working-directory: ios27

jobs:
  # ================= 静态闸门（本地同款，先红就别浪费编译时间）=================
  gates:
    name: 静态闸门（26 道）
    runs-on: ubuntu-latest
    # G-11：镜像抽风时不要按默认 6 小时占着跑。
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 安装 tree-sitter（真 Swift 语法树闸门依赖）
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 闸门脚本自身语法检查（工具也是代码）
        run: for f in Gates/*.js DesignLab/*.js; do node --check "$f" || exit 1; done

      - name: 跑全部闸门
        run: node Gates/allgates.js

      - name: DesignLab 生成（只生成 HTML，不截图 —— CI 上没有 Edge）
        run: node DesignLab/run.js --html-only

      - name: 上传 DesignLab 预览页
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios27-designlab
          path: ios27/DesignLab/out
          if-no-files-found: ignore

  # ================= 金标差分测试（引擎层回归，G-07）=================
  # 引擎层的回归保护（G-07）。旧仓的 fixtures/golden.json（40 条命令帧 / NIST AES /
  # 状态与日志解析 / ZOTP / 归属推断）在本仓一直"存在但没人跑"。
  #
  # 放在 xcode-27 而不是 macos-latest：后者只有 Xcode 26.6（最高 iOS 26.x runtime），
  # 而本工程部署目标是 iOS 27.0 ⇒ 那个镜像上**永远**没有合法 destination。
  # xcode-27 有 iOS 27 SDK；runtime 若缺失就显式下载，仍拿不到则如实标 test_executed=no。
  golden:
    name: 金标差分测试（引擎回归）
    runs-on: xcode-27
    needs: gates
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 金标差分测试
        id: golden
        run: |
          set -o pipefail
          mkdir -p build
          echo "== Xcode =="; xcodebuild -version
          has_runtime() { xcrun simctl list runtimes 2>/dev/null | grep -qE "iOS (2[7-9]|[3-9][0-9])\."; }
          if ! has_runtime; then
            echo "== 无 iOS 27+ 模拟器 runtime，尝试下载 =="
            xcodebuild -downloadPlatform iOS 2>&1 | tail -25 || true
          fi
          echo "== 可用 runtime =="; xcrun simctl list runtimes || true
          if ! has_runtime; then
            echo "test_executed=no" >> "$GITHUB_OUTPUT"
            echo "::warning::仍无 iOS 27+ 模拟器 runtime —— 金标测试本轮**未执行**（不是通过）。"
            echo '本机跑法：xcodebuild test -scheme LockKeeper -destination "platform=iOS Simulator,name=<设备>"' | tee build/test.log
            exit 0
          fi
          # 取一台真可用的 iPhone。用 simctl 的 JSON，**不要用 sed 的 s**：
          # BSD sed 不支持它，上一版因此把整行当成设备名，一条断言都没跑。
          DEV=$(xcrun simctl list devices available -j 2>/dev/null | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          names = [n["name"] for v in d.get("devices", {}).values() for n in v
                   if n.get("isAvailable") and n.get("name", "").startswith("iPhone")]
          print(names[0] if names else "")
          ')
          if [ -z "$DEV" ]; then
            echo "test_executed=no" >> "$GITHUB_OUTPUT"
            echo "::warning::有 runtime 但取不到可用 iPhone 设备 —— 金标测试本轮**未执行**。"
            exit 0
          fi
          echo "测试设备: $DEV"
          echo "test_executed=yes" >> "$GITHUB_OUTPUT"
          xcodebuild test \
            -project LockKeeper.xcodeproj \
            -scheme LockKeeper \
            -destination "platform=iOS Simulator,name=$DEV" \
            -derivedDataPath build/DerivedData \
            -configuration Debug \
            SWIFT_COMPILATION_MODE=wholemodule \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/test.log

      - name: 测试失败时把错误转成注解
        if: failure()
        run: |
          grep -E "error:|Testing failed:|XCTAssert" build/test.log 2>/dev/null | head -40 \
            | sed "s#^#::error file=ios27/Tests::#" || true

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios27-golden-test
          path: ios27/build/test.log
          if-no-files-found: ignore

      # 与 build job 的 ci-log 分开：两个 job 并发，同时 force-push 同一个孤儿分支
      # 会互相覆盖。用独立的 ci-test 分支，本地 git fetch 就能读到测试结论。
      - name: 发布测试结果到 ci-test 分支
        if: github.event_name == 'push' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p /tmp/citest
          [ -f build/test.log ] && cp build/test.log /tmp/citest/test.log
          echo "commit=$(git rev-parse HEAD)" > /tmp/citest/meta.txt
          echo "run=$GITHUB_RUN_ID" >> /tmp/citest/meta.txt
          echo "job=$GITHUB_JOB" >> /tmp/citest/meta.txt
          echo "test_log=$([ -f /tmp/citest/test.log ] && echo yes || echo no)" >> /tmp/citest/meta.txt
          echo "test_ok=$(grep -c "TEST SUCCEEDED" /tmp/citest/test.log 2>/dev/null || echo 0)" >> /tmp/citest/meta.txt
          echo "test_failed=$(grep -cE "TEST FAILED|Testing failed:" /tmp/citest/test.log 2>/dev/null || echo 0)" >> /tmp/citest/meta.txt
          # 本机判断"到底验没验"的依据：缺 runtime 时一条断言都没跑，
          # 只看 test_ok=0 会误读成"测试通过"。
          echo "test_executed=${{ steps.golden.outputs.test_executed }}" >> /tmp/citest/meta.txt
          echo "tests_executed=$(grep -cE "Test Case .* passed|Test Case .* failed" /tmp/citest/test.log 2>/dev/null || echo 0)" >> /tmp/citest/meta.txt

          cd /tmp/citest
          git init -q .
          git checkout -q -b ci-test
          git config user.name ci
          git config user.email ci@local
          git add -A && git commit -q -m "ci test log run=$GITHUB_RUN_ID" || true
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-test || true

  # ================= 真编译 =================
  build:
    name: 编译（iOS 27 SDK）
    runs-on: xcode-27
    needs: gates
    # G-11：xcode-27 是 preview 镜像，历史上抽风过（见文件头注释）。
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 环境信息
        run: |
          xcodebuild -version
          xcode-select -p

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成工程
        run: |
          xcodegen generate
          ls -la
          test -d LockKeeper.xcodeproj || { echo "::error::XcodeGen 没有生成 LockKeeper.xcodeproj"; exit 1; }
          # 构建号链路自检：只看不改。Info.plist 由 XcodeGen 生成，本机没有 xcodegen 无法预演它的
          # 输出格式（XML/二进制），所以这里只发警告，绝不因为自检本身把 build job 弄红。
          if ! grep -q "CFBundleVersion" App/Info.plist; then
            echo "::warning::Info.plist 里没有 CFBundleVersion（构建号可能没进包）"
          elif ! grep -A1 CFBundleVersion App/Info.plist | grep -q "CURRENT_PROJECT_VERSION"; then
            echo "::warning::CFBundleVersion 不是构建设置引用，构建号注入可能失效"
          else
            echo '构建号链路：CFBundleVersion = 构建设置引用，由 xcodebuild 在打包时展开'
          fi

      - name: 编译（整模块单次调用，一次列出全仓所有 error）
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild build \
            -project LockKeeper.xcodeproj \
            -scheme LockKeeper \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -configuration Debug \
            SWIFT_COMPILATION_MODE=wholemodule \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tee build/build.log


      - name: Archive（出可安装的未签名 IPA）
        run: |
          set -o pipefail
          xcodebuild archive \
            -project LockKeeper.xcodeproj \
            -scheme LockKeeper \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/LockKeeper.xcarchive \
            SWIFT_COMPILATION_MODE=wholemodule \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tee build/archive.log
          mkdir -p build/Payload
          cp -R "build/LockKeeper.xcarchive/Products/Applications/LockKeeper.app" build/Payload/
          # 文件名带上构建时刻 + 运行号 + commit 短哈希（G-14）。
          # 只带时刻的话，拿到一个 ipa 无法反查它是哪个 commit 出的 —— 装错版本比不装更糟，
          # 而"这包是哪次构建"恰恰是排查"我明明推了修复却没生效"的第一现场证据。
          STAMP=$(TZ=Asia/Shanghai date +%Y%m%d.%H%M%S)
          SHORT=$(git rev-parse --short=7 HEAD)
          NAME="LockKeeper-$STAMP-r${{ github.run_number }}-$SHORT-unsigned.ipa"
          echo "IPA 名称: $NAME"
          cd build && zip -qry "$NAME" Payload
          ls -lh LockKeeper-*-unsigned.ipa

      - name: 编译失败时把错误行转成注解（不登录也能读）
        if: failure()
        run: |
          for L in build/build.log build/archive.log; do
            [ -f "$L" ] || continue
            grep -E "error: " "$L" | sed "s#^#::error file=ios27/$L::#" || true
          done
          {
            echo "## 编译错误摘录（全量，去重）"
            if grep -hE "error: " build/build.log build/archive.log 2>/dev/null | sed -E 's#^/[^ ]*/##' | sort -u; then
              :
            else
              echo "（日志里没有 error: 行 —— 那多半是环境/签名问题，不是源码）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布到 Release（公开直链下载 IPA）
        # G-02：只在 main 的 push 上发布。PR（尤其 fork PR）不得改写公开 Release，
        # 也不该因为 token 只读而把整条 build job 弄红。
        if: github.event_name == 'push' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          IPA=$(ls build/LockKeeper-*-unsigned.ipa | head -1)
          echo "IPA: $IPA"
          NOTE="离线锁管家 iOS 27 · 未签名 IPA（用 AltStore / Sideloadly 自签后安装）"
          NOTE="$NOTE"$'\n'"构建: ${{ github.sha }}（run #${{ github.run_number }}）"
          NOTE="$NOTE"$'\n'"产物: $(basename "$IPA")"
          if ! gh release view ios27-latest >/dev/null 2>&1; then
            gh release create ios27-latest --title "iOS 27 · 最新构建" --notes "$NOTE" --prerelease
          fi
          # 只留最新一个 IPA：安装台上堆多份「看起来都一样」的包，装错版本比不装更糟。
          # 先删旧资产，再上传新的。注意管道里 grep 无匹配时不能因 set -e 让整步失败。
          OLD=$(gh release view ios27-latest --json assets --jq '.assets[].name' 2>/dev/null | grep -E '\.ipa$' || true)
          for old in $OLD; do
            gh release delete-asset ios27-latest "$old" -y || true
          done
          gh release upload ios27-latest "$IPA"
          gh release edit ios27-latest --notes "$NOTE"

      - name: 失败时把日志挂到 Release（公开可读，用于无鉴权排查）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p build
          for f in build/build.log build/archive.log; do
            [ -f "$f" ] && cp "$f" "build/$(basename "$f" .log)-run${{ github.run_id }}.log"
          done
          if ! gh release view ios27-diag >/dev/null 2>&1; then
            gh release create ios27-diag --title "ios27 构建诊断" --notes "失败构建的日志（自动发布）" --prerelease || true
          fi
          for f in build/*-run${{ github.run_id }}.log; do
            [ -f "$f" ] && gh release upload ios27-diag "$f" --clobber
          done
          # 没有日志文件时也留一条，避免"看不到"被误读成"没失败"
          if ! ls build/*-run${{ github.run_id }}.log >/dev/null 2>&1; then
            echo "本次失败没有产生 build.log / archive.log（多半红在更早的步骤）" > build/note-run${{ github.run_id }}.txt
            gh release upload ios27-diag "build/note-run${{ github.run_id }}.txt" --clobber || true
          fi

      - name: 上传编译日志 + IPA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios27-build
          path: |
            ios27/build/build.log
            ios27/build/archive.log
            ios27/build/LockKeeper-*-unsigned.ipa
          if-no-files-found: ignore

      - name: 发布构建日志到 ci-log 分支（供本地无网络时排查）
        # G-02：ci-log 是 force-push 的孤儿分支，PR 不许推它（否则任何 PR 都能改写排查基线）。
        if: github.event_name == 'push' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p /tmp/ciout
          [ -f build/build.log ] && cp build/build.log /tmp/ciout/build.log
          [ -f build/archive.log ] && cp build/archive.log /tmp/ciout/archive.log
          grep -E "error:" build/build.log 2>/dev/null | sed "s|.*/ios27/||" | sort -u > /tmp/ciout/errors.txt
          grep -E "error:" build/archive.log 2>/dev/null | sed "s|.*/ios27/||" | sort -u >> /tmp/ciout/errors.txt
          echo "commit=$(git rev-parse HEAD)" > /tmp/ciout/meta.txt
          echo "run=$GITHUB_RUN_ID" >> /tmp/ciout/meta.txt
          echo "job=$GITHUB_JOB" >> /tmp/ciout/meta.txt
          echo "errors=$(wc -l < /tmp/ciout/errors.txt 2>/dev/null || echo 0)" >> /tmp/ciout/meta.txt
          # errors=0 只说明**编译**没有 error 行 —— 它不等于 job 绿。
          # 测试步骤失败时 archive 不会跑（archive.log 根本不存在），而 errors 仍是 0。
          # 所以把每一步的产物与结论都记下来，让本地能独立判断"到底绿没绿"。
          # 2026-11-01：`build_log=no` 时本地只能猜"红在更早的步骤"（xcodegen/brew/checkout）。
          # 把**工程是否生成**与**源码文件数**也记进来 —— 一眼能分开"xcodegen 挂了"与"根本没 checkout 到"。
          echo "project=$([ -d LockKeeper.xcodeproj ] && echo yes || echo no)" >> /tmp/ciout/meta.txt
          echo "swift_files=$(find App -name "*.swift" 2>/dev/null | wc -l | tr -d " ")" >> /tmp/ciout/meta.txt
          echo "build_log=$([ -f /tmp/ciout/build.log ] && echo yes || echo no)" >> /tmp/ciout/meta.txt
          echo "archive_log=$([ -f /tmp/ciout/archive.log ] && echo yes || echo no)" >> /tmp/ciout/meta.txt
          echo "build_ok=$(grep -c "BUILD SUCCEEDED" /tmp/ciout/build.log 2>/dev/null || echo 0)" >> /tmp/ciout/meta.txt
          echo "archive_ok=$(grep -c "ARCHIVE SUCCEEDED" /tmp/ciout/archive.log 2>/dev/null || echo 0)" >> /tmp/ciout/meta.txt
          # 2026-11-01：把**源码告警数**也记进来。此前只记 errors/build_ok/archive_ok，
          # 于是「build.log 里有 6 条 warning」这件事从来没人看 —— 而其中一条是真缺陷
          # （AppLock 的 return 之后有死代码，刷脸成功永不清冷却）。
          # 口径：只数源码告警行（路径以 App/ 开头），排除 Xcode 回显（"| ... warning:"）与工具提示。
          echo "warnings=$(grep -cE "^/Users/runner/work/ios-app/ios-app/ios27/App/.*: warning:" /tmp/ciout/build.log 2>/dev/null || echo 0)" >> /tmp/ciout/meta.txt
          cd /tmp/ciout
          git init -q .
          git checkout -q -b ci-log
          git config user.name ci
          git config user.email ci@local
          git add -A
          git commit -q -m "ci log $GITHUB_RUN_ID" || true
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log || true

  # ================= 真机截图（供本地无 Xcode 时"看见"界面）=================
  # 开发机是 Windows，没有 Xcode / 模拟器 —— 这是唯一能拿到**真实渲染**的途径。
  # 用 simctl 直接截屏，不需要 UI Test target（不改工程结构，坏了也不会拖垮编译）。
  # continue-on-error: 截图是诊断能力，不能因为它失败就把整条流水线弄红。

  # 2026-11-03：截图**合并回主 workflow**，但排在 build 之后（needs: build）——
  # 编译结论先出，截图随后跑；既拿得到图，也不阻塞编译反馈。
  # 之前拆成独立 workflow 后 ci-shots 再没更新过（独立文件始终没被触发，原因不明）。

  # 2026-11-03（第三次也是最后一次调整）：本仓库上 schedule 与 workflow_dispatch 均不触发，
  # 唯一能出图的路径是 **push 触发的合并 workflow**。所以 shots 回到这里、排在 build 之后；
  # 出图的办法是**推一次之后不再推**，给这一轮 25 分钟跑完（11ff148f 批次就是这么来的）。
  shots:
    name: 模拟器截图（诊断用）
    runs-on: xcode-27
    needs: build
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: 安装 XcodeGen
        run: brew install xcodegen || true
      - name: 生成工程
        run: xcodegen generate
      - name: 选一个可用模拟器
        id: sim
        run: |
          set -e
          LINE=$(xcrun simctl list devices available | grep -m1 "iPhone" || true)
          echo "$LINE"
          DEV=$(echo "$LINE" | grep -oE "[0-9A-Fa-f-]{36}" | head -1)
          echo "udid=$DEV" >> "$GITHUB_OUTPUT"
          test -n "$DEV"
      - name: 编译到模拟器
        run: |
          set -o pipefail
          xcodebuild build -project LockKeeper.xcodeproj -scheme LockKeeper \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/Sim -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tail -40
      - name: 逐 Tab 截图
        run: |
          set +e
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find build/Sim/Build/Products -name "LockKeeper.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" "$APP" || exit 1
          # 预授权系统弹窗 —— 否则第一次启动的通知权限对话框会挡住截图（13 号截图实测被挡）。
          xcrun simctl privacy "$UDID" grant notifications com.aapk.lockkeeper 2>/dev/null || true
          xcrun simctl privacy "$UDID" grant user_tracking com.aapk.lockkeeper 2>/dev/null || true
          xcrun simctl privacy "$UDID" grant localnetwork com.aapk.lockkeeper 2>/dev/null || true
          xcrun simctl spawn "$UDID" defaults write com.aapk.lockkeeper NSUserNotificationUsageDescriptionIsUseless -bool YES 2>/dev/null || true
          mkdir -p /tmp/shots
          # 合成数据（kf-bundle 格式）：让刻度盘/凭证卡/时间线有东西可渲染。
          # 文件在仓库 .github-seed/，PIN/skey 全部合成，不含真密钥。
          SEED_SRC="$GITHUB_WORKSPACE/ios27/.github-seed/kf-seed.json"
          APPDATA=$(xcrun simctl get_app_container "$UDID" com.aapk.lockkeeper data 2>/dev/null || true)
          if [ -n "$APPDATA" ] && [ -f "$SEED_SRC" ]; then
            mkdir -p "$APPDATA/Documents"
            cp "$SEED_SRC" "$APPDATA/Documents/kf-seed.json"
            echo "seed placed at $APPDATA/Documents/kf-seed.json"
          fi
          i=0
          for name in door keys records household settings; do
            xcrun simctl terminate "$UDID" com.aapk.lockkeeper 2>/dev/null || true
            xcrun simctl launch "$UDID" com.aapk.lockkeeper -kfUITest -kfSeed -kfTab $i || true
            sleep 4
            xcrun simctl io "$UDID" screenshot "/tmp/shots/$i-$name.png" || true
            i=$((i+1))
          done
          # 整页截屏（**算法级**，不是滚到底）：App 把 ScrollView 的 frame 临时撑到
          # contentSize 高度后一次成像，中间内容不会漏。产物落在 App 容器 Documents/，
          # 这里用 simctl get_app_container 拷出来，命名 <i>-<name>-full.png。
          i=0
          for name in door keys records household settings; do
            xcrun simctl terminate "$UDID" com.aapk.lockkeeper 2>/dev/null || true
            xcrun simctl launch "$UDID" com.aapk.lockkeeper -kfUITest -kfSeed -kfFullPage -kfTab $i || true
            sleep 7
            CONTAINER=$(xcrun simctl get_app_container "$UDID" com.aapk.lockkeeper data 2>/dev/null || true)
            if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/kf-fullpage-$i-tab.png" ]; then
              cp "$CONTAINER/Documents/kf-fullpage-$i-tab.png" "/tmp/shots/$i-$name-full.png" || true
            else
              echo "fullpage missing for $name (tab $i)"
            fi
            i=$((i+1))
          done
          # 2026-11-03：关键子页 —— 大标题模式、读数网格、凭证行、工作流都要看真机渲染。
          # ASCII 名（中文名经 locale 管道会变 mojibake）；每个目标截 2 次（竞态重试）。
          # 缺某张图 = 那个子页在空数据下崩了 —— 本身就是 god 模式要抓的缺陷。
          j=10
          for dest in lockStatus deviceInfo lockSettings defend keyCreate zotp recordsStudio backupStudio godMode hardware; do
            xcrun simctl terminate "$UDID" com.aapk.lockkeeper 2>/dev/null || true
            xcrun simctl launch "$UDID" com.aapk.lockkeeper -kfUITest -kfSeed -kfDest "$dest" || true
            sleep 5
            xcrun simctl io "$UDID" screenshot "/tmp/shots/$j-$dest.png" 2>/dev/null || true
            sleep 1
            xcrun simctl io "$UDID" screenshot "/tmp/shots/$j-$dest.png" 2>/dev/null || true
            j=$((j+1))
          done
          # 子页整页截图：-kfDest 压栈 + -kfFullPage 整页成像（App 侧延迟 5.5s 等 push 完成）。
          j=10
          for dest in lockStatus deviceInfo lockSettings defend keyCreate zotp recordsStudio backupStudio godMode hardware; do
            xcrun simctl terminate "$UDID" com.aapk.lockkeeper 2>/dev/null || true
            xcrun simctl launch "$UDID" com.aapk.lockkeeper -kfUITest -kfSeed -kfFullPage -kfTab 0 -kfDest "$dest" || true
            sleep 8
            CONTAINER=$(xcrun simctl get_app_container "$UDID" com.aapk.lockkeeper data 2>/dev/null || true)
            if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/kf-fullpage-0-$dest.png" ]; then
              cp "$CONTAINER/Documents/kf-fullpage-0-$dest.png" "/tmp/shots/$j-$dest-full.png" || true
            else
              echo "subpage fullpage missing: $dest"
            fi
            j=$((j+1))
          done
          ls -la /tmp/shots
      - name: 空白页检测（整页单色 = 页面卡死/崩溃）
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, sys
          try:
              from PIL import Image, ImageStat
          except Exception as e:
              print("PIL 不可用，跳过空白检测:", e); sys.exit(0)
          bad = []
          for f in sorted(glob.glob("/tmp/shots/*.png")):
              try:
                  im = Image.open(f).convert("RGB").resize((64, 128))
                  st = ImageStat.Stat(im)
                  spread = max(st.stddev)
                  if spread < 6:
                      bad.append((os.path.basename(f), round(spread, 2)))
              except Exception as e:
                  bad.append((os.path.basename(f), "unreadable"))
          if bad:
              print("::warning::疑似空白页（整页单色，页面可能卡死/崩溃）：")
              for name, v in bad:
                  print(f"  {name}  stddev={v}")
              with open("/tmp/shots/blank-report.txt", "w") as fh:
                  fh.write("\n".join(f"{n}\t{v}" for n, v in bad))
          else:
              print("空白检测通过：所有截图都有内容")
          PY

      - name: 推到 ci-shots 分支
        if: github.event_name == 'push' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cd /tmp/shots || exit 0
          echo "commit=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" > meta.txt
          echo "run=$GITHUB_RUN_ID" >> meta.txt
          echo "count=$(ls *.png 2>/dev/null | wc -l | tr -d ' ')" >> meta.txt
          git init -q .
          git checkout -q -b ci-shots
          git config user.name ci
          git config user.email ci@local
          git add -A
          git commit -q -m "ci shots $GITHUB_RUN_ID" || true
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots || true

  # ================= Android APK（与 iOS 并行构建）=================
  # 2026-11-03：用户要求「同时构建 android」。只做构建与产物上传，
  # 不搬旧 ios.yml 里那 18 个 Kotlin 静态闸门（它们的脚本已随旧工具链归档，
  # 且属于旧审计体系；需要时从 _archive/ios-app-legacy/tools/ 取回再接）。
  android:
    name: Build (Android 13+, APK)
    runs-on: ubuntu-latest
    needs: gates
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 的 ubuntu 镜像自带 Android SDK（$ANDROID_HOME 已设、licenses 已接受）
      - name: 确认镜像自带 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: 编译 APK (debug, 可直接安装)
        working-directory: android-app
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 编译失败时输出错误摘要
        if: failure()
        working-directory: android-app
        run: |
          echo "## Android 编译错误" >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |error:" build.log | head -40 >> $GITHUB_STEP_SUMMARY || true

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: KfKey-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
