# ios27 云编译 —— 全新 iOS 27 App 的闸门 + 编译
#
# 镜像: `xcode-27`（Public preview, macOS 27 arm64）—— 带 iOS 27.0/27.1/27.2 SDK。
#   与仓库里既有的 ios.yml 同一个镜像；它抽风时把 runs-on 改回 macos-latest 即可。
#
# 为什么需要云端：开发机是 Windows，没有 Xcode，也没有 iOS 模拟器。
# 本地能跑的是 11 道静态闸门 + DesignLab 截图；真编译只能在这里做。
#
# 关键技巧（从既有 ios.yml 学来的）：SWIFT_COMPILATION_MODE=wholemodule
#   默认增量模式下一个文件失败就停，只能一轮挤一个错。整模块单次调用会把**全仓所有** error
#   一次列出来 —— 这个 App 还没在真编译器上跑过，第一轮大概率有一批，必须一次看全。
name: ios27

on:
  push:
    branches: [main, master]
    paths:
      - "ios27/**"
      - ".github/workflows/ios27.yml"
  pull_request:
    paths:
      - "ios27/**"
      - ".github/workflows/ios27.yml"
  workflow_dispatch:

permissions:
  # Release 资产是公开直链可下载的；artifact 下载要登录，所以 IPA 必须挂 Release。
  contents: write

defaults:
  run:
    working-directory: ios27

jobs:
  # ================= 静态闸门（本地同款，先红就别浪费编译时间）=================
  gates:
    name: 静态闸门（11 道）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 安装 tree-sitter（真 Swift 语法树闸门依赖）
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 闸门脚本自身语法检查（工具也是代码）
        run: for f in Gates/*.js DesignLab/*.js; do node --check "$f" || exit 1; done

      - name: 跑全部闸门
        run: node Gates/allgates.js

      - name: DesignLab 生成（只生成 HTML，不截图 —— CI 上没有 Edge）
        run: node DesignLab/run.js --html-only

      - name: 上传 DesignLab 预览页
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios27-designlab
          path: ios27/DesignLab/out
          if-no-files-found: ignore

  # ================= 真编译 =================
  build:
    name: 编译（iOS 27 SDK）
    runs-on: xcode-27
    needs: gates
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 环境信息
        run: |
          xcodebuild -version
          xcode-select -p

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成工程
        run: |
          xcodegen generate
          ls -la
          test -d LockKeeper.xcodeproj || { echo "::error::XcodeGen 没有生成 LockKeeper.xcodeproj"; exit 1; }

      - name: 编译（整模块单次调用，一次列出全仓所有 error）
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild build \
            -project LockKeeper.xcodeproj \
            -scheme LockKeeper \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -configuration Debug \
            SWIFT_COMPILATION_MODE=wholemodule \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tee build/build.log

      - name: Archive（出可安装的未签名 IPA）
        run: |
          set -o pipefail
          xcodebuild archive \
            -project LockKeeper.xcodeproj \
            -scheme LockKeeper \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/LockKeeper.xcarchive \
            SWIFT_COMPILATION_MODE=wholemodule \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tee build/archive.log
          mkdir -p build/Payload
          cp -R "build/LockKeeper.xcarchive/Products/Applications/LockKeeper.app" build/Payload/
          # 文件名带上构建时刻：安装台上堆三份 "LockKeeper.ipa" 时，装错版本比不装更糟
          STAMP=$(TZ=Asia/Shanghai date +%Y%m%d.%H%M%S)
          cd build && zip -qry "LockKeeper-$STAMP-unsigned.ipa" Payload
          ls -lh LockKeeper-*-unsigned.ipa

      - name: 编译失败时把错误行转成注解（不登录也能读）
        if: failure()
        run: |
          for L in build/build.log build/archive.log; do
            [ -f "$L" ] || continue
            grep -E "error: " "$L" | sed "s#^#::error file=ios27/$L::#" || true
          done
          {
            echo "## 编译错误摘录（全量，去重）"
            if grep -hE "error: " build/build.log build/archive.log 2>/dev/null | sed -E 's#^/[^ ]*/##' | sort -u; then
              :
            else
              echo "（日志里没有 error: 行 —— 那多半是环境/签名问题，不是源码）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布到 Release（公开直链下载 IPA）
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          IPA=$(ls build/LockKeeper-*-unsigned.ipa | head -1)
          echo "IPA: $IPA"
          NOTE="离线锁管家 iOS 27 全新建屏 · 未签名 IPA（用 AltStore / Sideloadly 自签后安装）· 构建 ${{ github.sha }}"
          if ! gh release view ios27-latest >/dev/null 2>&1; then
            gh release create ios27-latest --title "iOS 27 · 最新构建" --notes "$NOTE" --prerelease
          fi
          # 只留最新一个 IPA：安装台上堆多份「看起来都一样」的包，装错版本比不装更糟。
          # 先删旧资产，再上传新的。注意管道里 grep 无匹配时不能因 set -e 让整步失败。
          OLD=$(gh release view ios27-latest --json assets --jq '.assets[].name' 2>/dev/null | grep -E '\.ipa$' || true)
          for old in $OLD; do
            gh release delete-asset ios27-latest "$old" -y || true
          done
          gh release upload ios27-latest "$IPA"
          gh release edit ios27-latest --notes "$NOTE"

      - name: 失败时把日志挂到 Release（公开可读，用于无鉴权排查）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p build
          for f in build/build.log build/archive.log; do
            [ -f "$f" ] && cp "$f" "build/$(basename "$f" .log)-run${{ github.run_id }}.log"
          done
          if ! gh release view ios27-diag >/dev/null 2>&1; then
            gh release create ios27-diag --title "ios27 构建诊断" --notes "失败构建的日志（自动发布）" --prerelease || true
          fi
          for f in build/*-run${{ github.run_id }}.log; do
            [ -f "$f" ] && gh release upload ios27-diag "$f" --clobber
          done
          # 没有日志文件时也留一条，避免"看不到"被误读成"没失败"
          if ! ls build/*-run${{ github.run_id }}.log >/dev/null 2>&1; then
            echo "本次失败没有产生 build.log / archive.log（多半红在更早的步骤）" > build/note-run${{ github.run_id }}.txt
            gh release upload ios27-diag "build/note-run${{ github.run_id }}.txt" --clobber || true
          fi

      - name: 上传编译日志 + IPA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios27-build
          path: |
            ios27/build/build.log
            ios27/build/archive.log
            ios27/build/LockKeeper-*-unsigned.ipa
          if-no-files-found: ignore
