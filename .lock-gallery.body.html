<header>
  <h1>锁体设计总览 · <em>5 位设计师</em></h1>
  <p class="lead">
    5 个设计子代理，各自的<strong>设计基因</strong>：
    <b>A</b> 包豪斯／瑞士国际主义 · <b>B</b> 东方器物／宋代极简 · <b>C</b> 高级制表／机械感 ·
    <b>D</b> 当代艺术／雕塑感 · <b>E</b> 极致工艺／材质对比。<br>
    同一个目标：<b>高雅、精致、有气质的入户门锁</b>。拖拽 360° 看。
  </p>
</header>

<div id="boot">正在初始化…</div>

<div class="states">
  <span class="lbl">状态</span>
  <button data-mode="locked" aria-pressed="true">已锁</button>
  <button data-mode="charge" aria-pressed="false">按住充能</button>
  <button data-mode="open" aria-pressed="false">已开</button>
  <button data-mode="deadbolt" aria-pressed="false">反锁</button>
  <button data-mode="fail" aria-pressed="false">失败</button>
  <span class="hint" id="count"></span>
</div>

<div class="grid" id="grid"></div>

<footer id="foot"></footer>
