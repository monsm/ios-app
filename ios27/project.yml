# project.yml —— XcodeGen 工程描述。CI 用 xcodegen 生成 .xcodeproj 再编译。
#
# 目标：iOS 27.0 起（最低部署版本）。SwiftUI 全原生，无第三方依赖。
name: LockKeeper
options:
  bundleIdPrefix: com.aapk
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    # ============ 语言模式 ============
    # 引擎层（66 文件）是从上一版照搬的 Swift 6 代码，本来就在 Swift 6 + strict concurrency 下编译过。
    # 界面层（47 文件）是这次新写的，还没做并发迁移 —— 直接开 Swift 6 会因"静态属性非 Sendable"
    # 这类问题整片报错。所以按老仓验证过的两步走：
    #   ① 先 SWIFT_VERSION 5.0 + strict concurrency complete —— 并发问题是**告警**，工程照常编译，
    #      而告警清单就是完整的迁移待办表；
    #   ② 按清单逐条修完再切 6.0（这一步还没做，见 docs/COMPLETION.md 的"未闭环"）。
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  LockKeeper:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aapk.lockkeeper
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 锁管家
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        UIRequiresFullScreen: true
        # 蓝牙：本 App 唯一的对外通信通道
        NSBluetoothAlwaysUsageDescription: 需要蓝牙连接你的门锁。App 不联网、不上传任何数据。
        NSBluetoothPeripheralUsageDescription: 需要蓝牙连接你的门锁。
        NSFaceIDUsageDescription: 用面容解锁本机数据保护。
        # 相册/相机：仅用于"分享给安卓"的二维码
        NSCameraUsageDescription: 扫描二维码以从安卓手机导入凭证。
        # 深链：kf://（通知点开、分享导入）
        CFBundleURLTypes:
          - CFBundleURLName: com.aapk.lockkeeper
            CFBundleURLSchemes:
              - kf
        # DFU 升级期间需要后台保持蓝牙连接
        UIBackgroundModes:
          - bluetooth-central
        # 隐私清单
        ITSAppUsesNonExemptEncryption: NO

schemes:
  LockKeeper:
    build:
      targets:
        LockKeeper: all
    run:
      config: Debug