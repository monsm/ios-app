# project.yml —— XcodeGen 工程描述。CI 用 xcodegen 生成 .xcodeproj 再编译。
#
# 目标：iOS 27.0 起（最低部署版本）。SwiftUI 全原生，无第三方依赖。
name: LockKeeper
options:
  bundleIdPrefix: com.aapk
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    # ============ 语言模式 ============
    # 引擎层（66 文件）是从上一版照搬的 Swift 6 代码，本来就在 Swift 6 + strict concurrency 下编译过。
    # 界面层（47 文件）是这次新写的，还没做并发迁移 —— 直接开 Swift 6 会因"静态属性非 Sendable"
    # 这类问题整片报错。所以按老仓验证过的两步走：
    #   ① 先 SWIFT_VERSION 5.0 + strict concurrency complete —— 并发问题是**告警**，工程照常编译，
    #      而告警清单就是完整的迁移待办表；
    #   ② 按清单逐条修完再切 6.0（这一步还没做，见 docs/COMPLETION.md 的"未闭环"）。
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  LockKeeper:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aapk.lockkeeper
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        # 构建号：本地默认 1；CI 用 CURRENT_PROJECT_VERSION=github.run_number 覆盖
        # （xcodebuild 命令行设置优先于工程设置；Info.plist 里的 $(CURRENT_PROJECT_VERSION) 打包时展开）
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 锁管家
        CFBundleShortVersionString: "1.0"
        # 构建号可被 CI 注入：XcodeGen 不做环境变量替换，所以这里写**构建设置引用**，
        # 由 xcodebuild 在打包时展开（CI 传 CURRENT_PROJECT_VERSION=github.run_number，本地回落 1）。
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        UIRequiresFullScreen: true
        # 蓝牙：门锁通信的唯一通道。备份工作室可选用 URLSession 连用户自建的 WebDAV，
        # 所以不能写「App 不联网」—— 隐私文案必须与实际能力一致。
        NSBluetoothAlwaysUsageDescription: 需要蓝牙连接你的门锁。门锁通信不经过网络；备份工作室可选连你自建的 WebDAV。
        NSBluetoothPeripheralUsageDescription: 需要蓝牙连接你的门锁。
        NSFaceIDUsageDescription: 用面容解锁本机数据保护。
        # 深链：kf://（通知点开、分享导入）
        CFBundleURLTypes:
          - CFBundleURLName: com.aapk.lockkeeper
            CFBundleURLSchemes:
              - kf
        # DFU 升级期间需要后台保持蓝牙连接
        UIBackgroundModes:
          - bluetooth-central
        # 局域网/WebDAV：备份工作室允许用户连自建 HTTP 服务器
        NSLocalNetworkUsageDescription: 备份工作室需要访问你在局域网内的 WebDAV 服务器。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 隐私清单
        ITSAppUsesNonExemptEncryption: NO

schemes:
  LockKeeper:
    build:
      targets:
        LockKeeper: all
    run:
      config: Debug