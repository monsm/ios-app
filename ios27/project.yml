# project.yml —— XcodeGen 工程描述。CI 用 xcodegen 生成 .xcodeproj 再编译。
#
# 目标：iOS 27.0 起（最低部署版本）。SwiftUI 全原生，无第三方依赖。
name: LockKeeper
options:
  bundleIdPrefix: com.aapk
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    # ============ 语言模式 ============
    # 引擎层（66 文件）是从上一版照搬的 Swift 6 代码，本来就在 Swift 6 + strict concurrency 下编译过。
    # 界面层（47 文件）是这次新写的，还没做并发迁移 —— 直接开 Swift 6 会因"静态属性非 Sendable"
    # 这类问题整片报错。所以按老仓验证过的两步走：
    #   ① 先 SWIFT_VERSION 5.0 + strict concurrency complete —— 并发问题是**告警**，工程照常编译，
    #      而告警清单就是完整的迁移待办表；
    #   ② 按清单逐条修完再切 6.0（这一步还没做，见 docs/COMPLETION.md 的"未闭环"）。
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  LockKeeper:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aapk.lockkeeper
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        # 构建号：本地默认 1；CI 用 CURRENT_PROJECT_VERSION=github.run_number 覆盖
        # （xcodebuild 命令行设置优先于工程设置；Info.plist 里的 $(CURRENT_PROJECT_VERSION) 打包时展开）
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 锁管家
        CFBundleShortVersionString: "1.0"
        # 构建号可被 CI 注入：XcodeGen 不做环境变量替换，所以这里写**构建设置引用**，
        # 由 xcodebuild 在打包时展开（CI 传 CURRENT_PROJECT_VERSION=github.run_number，本地回落 1）。
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        # UIRequiresFullScreen 在 iOS 26 起已被系统忽略且 deprecated；竖屏锁定由
        # UISupportedInterfaceOrientations 单独保证，此键删除（消除项目级告警）。
        # 蓝牙：门锁通信的唯一通道。备份工作室可选用 URLSession 连用户自建的 WebDAV，
        # 所以不能写「App 不联网」—— 隐私文案必须与实际能力一致。
        NSBluetoothAlwaysUsageDescription: 需要蓝牙连接你的门锁。门锁通信不经过网络；备份工作室可选连你自建的 WebDAV。
        NSBluetoothPeripheralUsageDescription: 需要蓝牙连接你的门锁。
        NSFaceIDUsageDescription: 用面容解锁本机数据保护。
        # 深链：kf://（通知点开、分享导入）
        CFBundleURLTypes:
          - CFBundleURLName: com.aapk.lockkeeper
            CFBundleURLSchemes:
              - kf
        # DFU 升级期间需要后台保持蓝牙连接
        UIBackgroundModes:
          - bluetooth-central
        # 局域网/WebDAV：备份工作室连用户自建的 WebDAV（**只接受 https**，见 WebDAV.normalized）。
        # NSAllowsLocalNetworking 现在的正当理由只剩「localhost 回环调试」这一条。
        NSLocalNetworkUsageDescription: 备份工作室需要访问你在局域网内的 WebDAV 服务器（https）。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 备选 App 图标（G-06）：8 套 icon 原本是死资产 —— 这里登记后，
        # 设置页的「换图标」才真的能调 setAlternateIconName 生效。
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIcon-Bell:
              CFBundleIconFiles:
                - AppIcon-Bell
            AppIcon-Guard:
              CFBundleIconFiles:
                - AppIcon-Guard
            AppIcon-Heart:
              CFBundleIconFiles:
                - AppIcon-Heart
            AppIcon-Home:
              CFBundleIconFiles:
                - AppIcon-Home
            AppIcon-Key:
              CFBundleIconFiles:
                - AppIcon-Key
            AppIcon-Pin:
              CFBundleIconFiles:
                - AppIcon-Pin
            AppIcon-Ring:
              CFBundleIconFiles:
                - AppIcon-Ring
            AppIcon-Shield:
              CFBundleIconFiles:
                - AppIcon-Shield
        # 隐私清单
        ITSAppUsesNonExemptEncryption: NO

  # G-07（真跑起来的那一半）：协议层的差分回归，**macOS 原生，不需要 iOS 模拟器**。
  # 为什么能这么做：协议层只依赖 Foundation + CommonCrypto + Compression，
  # 没有一行 UIKit / CoreBluetooth。所以把同一批源文件直接编进 macOS 测试 bundle，
  # 在 macos-latest 上就能真跑 —— CI 的两个镜像都没有 iOS 27 模拟器 runtime（第一轮实测），
  # 那是"金标从未执行"的根因。
  #
  # 注意：这里**不建 framework**。iOS framework 不能作为 macOS 测试目标的依赖；
  # 单元测试 bundle 自己编源文件反而更简单（也不需要 @testable import）。
  CoreProtocolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TestsCore
      - path: ../fixtures/golden.json
        buildPhase: resources
      # 协议层源码（与 App 用的是同一份文件，不是拷贝 —— 改了这里就一起变）
      - path: App/Engine/AESKit.swift
      - path: App/Engine/HexKit.swift
      - path: App/Engine/Locked.swift
      - path: App/Engine/ZKProtocol.swift
      - path: App/Engine/ZKCmdBuilder.swift
      - path: App/Engine/StatusParser.swift
      - path: App/Engine/ZOTP.swift
      - path: App/Engine/KeyGen.swift
      - path: App/Engine/PidMap.swift
      - path: App/Engine/Attribution.swift
      - path: App/Engine/ZipKit.swift
      - path: App/Engine/HardwareService.swift
      - path: App/Engine/BLETypes.swift
      - path: App/Engine/StoreModels.swift
      - path: App/Engine/Store.swift
      - path: App/Engine/BackupKit.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aapk.lockkeeper.coretests
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  # 界面层的冒烟测试：**需要 iOS 27 模拟器**，CI 上通常跑不了（如实标注，不假装通过）。
  LockKeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../fixtures/golden.json
        buildPhase: resources
    dependencies:
      - target: LockKeeper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aapk.lockkeeper.tests

schemes:
  LockKeeper:
    build:
      targets:
        LockKeeper: all
        LockKeeperTests: [test]
        CoreProtocolTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LockKeeperTests
        - CoreProtocolTests

  # 专供 CI 的金标 scheme：只跑 macOS 上的协议层测试。
  # 这样 macos-latest 不需要 iOS 模拟器也能**真执行** 40 条命令帧 / NIST AES / 解析 / ZOTP。
  CoreGolden:
    build:
      targets:
        CoreProtocolTests: [test]
    test:
      config: Debug
      targets:
        - CoreProtocolTests