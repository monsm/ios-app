# project.yml —— XcodeGen 工程描述。CI 用 xcodegen 生成 .xcodeproj 再编译。
#
# 目标：iOS 27.0 起（最低部署版本）。SwiftUI 全原生，无第三方依赖。
name: LockKeeper
options:
  bundleIdPrefix: com.aapk
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    # ============ 语言模式 ============
    # 引擎层（66 文件）是从上一版照搬的 Swift 6 代码，本来就在 Swift 6 + strict concurrency 下编译过。
    # 界面层（47 文件）是这次新写的，还没做并发迁移 —— 直接开 Swift 6 会因"静态属性非 Sendable"
    # 这类问题整片报错。所以按老仓验证过的两步走：
    #   ① 先 SWIFT_VERSION 5.0 + strict concurrency complete —— 并发问题是**告警**，工程照常编译，
    #      而告警清单就是完整的迁移待办表；
    #   ② 按清单逐条修完再切 6.0（这一步还没做，见 docs/COMPLETION.md 的"未闭环"）。
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  LockKeeper:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aapk.lockkeeper
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        # 构建号：本地默认 1；CI 用 CURRENT_PROJECT_VERSION=github.run_number 覆盖
        # （xcodebuild 命令行设置优先于工程设置；Info.plist 里的 $(CURRENT_PROJECT_VERSION) 打包时展开）
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 锁管家
        CFBundleShortVersionString: "1.0"
        # 构建号可被 CI 注入：XcodeGen 不做环境变量替换，所以这里写**构建设置引用**，
        # 由 xcodebuild 在打包时展开（CI 传 CURRENT_PROJECT_VERSION=github.run_number，本地回落 1）。
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 2026-11-04（上架流程 · 每次都卡）：缺这个键时，**每一个 build** 上传到 App Store Connect
        # 都会被问一次出口合规（"App 是否使用非豁免加密"），TestFlight 处理会停在那里等回答。
        # 声明 false 的依据：App 只使用 Apple 系统提供的标准算法（CommonCrypto AES-128 / Keychain），
        # 用于与自家门锁的配对认证和本机数据保护；没有自研密码学，没有对用户内容做额外加密传输。
        # 这属于 Apple 的"标准加密算法"豁免。**提交前请再核一遍此判断**（政策会变）。
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        # UIRequiresFullScreen 在 iOS 26 起已被系统忽略且 deprecated；竖屏锁定由
        # UISupportedInterfaceOrientations 单独保证，此键删除（消除项目级告警）。
        # 蓝牙：门锁通信的唯一通道。备份工作室可选用 URLSession 连用户自建的 WebDAV，
        # 所以不能写「App 不联网」—— 隐私文案必须与实际能力一致。
        NSBluetoothAlwaysUsageDescription: 需要蓝牙连接你的门锁。门锁通信不经过网络；备份工作室可选连你自建的 WebDAV。
        NSBluetoothPeripheralUsageDescription: 需要蓝牙连接你的门锁。
        NSFaceIDUsageDescription: 用面容解锁本机数据保护。
        # 深链：kf://（通知点开、分享导入）
        CFBundleURLTypes:
          - CFBundleURLName: com.aapk.lockkeeper
            CFBundleURLSchemes:
              - kf
        # DFU 升级期间需要后台保持蓝牙连接
        UIBackgroundModes:
          - bluetooth-central
        # 局域网/WebDAV：备份工作室连用户自建的 WebDAV（**只接受 https**，见 WebDAV.normalized）。
        # NSAllowsLocalNetworking 现在的正当理由只剩「localhost 回环调试」这一条。
        NSLocalNetworkUsageDescription: 备份工作室需要访问你在局域网内的 WebDAV 服务器（https）。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 备选 App 图标（G-06）：8 套 icon 原本是死资产 —— 这里登记后，
        # 设置页的「换图标」才真的能调 setAlternateIconName 生效。
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIcon-Bell:
              CFBundleIconFiles:
                - AppIcon-Bell
            AppIcon-Guard:
              CFBundleIconFiles:
                - AppIcon-Guard
            AppIcon-Heart:
              CFBundleIconFiles:
                - AppIcon-Heart
            AppIcon-Home:
              CFBundleIconFiles:
                - AppIcon-Home
            AppIcon-Key:
              CFBundleIconFiles:
                - AppIcon-Key
            AppIcon-Pin:
              CFBundleIconFiles:
                - AppIcon-Pin
            AppIcon-Ring:
              CFBundleIconFiles:
                - AppIcon-Ring
            AppIcon-Shield:
              CFBundleIconFiles:
                - AppIcon-Shield
        # 隐私清单
        ITSAppUsesNonExemptEncryption: NO

  # G-07 说明：试过把协议层单独编成 macOS 测试 bundle（那样 CI 不需要 iOS 模拟器）。
  # 实测不可行：ZKProtocol 依赖 BleTelemetry → DiagKit（UIKit + CoreBluetooth + UserNotifications），
  # Store 依赖 SecretStore/Security，闭包一路拖到整个 DB 层。硬抽出来要么改生产代码，
  # 要么写一堆假实现 —— 后者等于测假货，比不测更糟。所以保持 iOS 目标，
  # 并由 golden job 如实报告"本轮是否真的执行了"（test_executed）。

  # 界面层的冒烟测试：**需要 iOS 27 模拟器**，CI 上通常跑不了（如实标注，不假装通过）。
  LockKeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../fixtures/golden.json
        buildPhase: resources
    dependencies:
      - target: LockKeeper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aapk.lockkeeper.tests

schemes:
  LockKeeper:
    build:
      targets:
        LockKeeper: all
        LockKeeperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LockKeeperTests