<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>@import "v9.css";
.phone[data-atmo="graphite"]::before{background:radial-gradient(closest-side,rgba(91,97,105,.07),transparent 72%)}
.phone[data-atmo="graphite"]::after{background:radial-gradient(closest-side,rgba(91,97,105,.04),transparent 72%)}
</style></head>
<body><div class="phone" data-mode="light" data-atmo="graphite">
<div class="statusbar"><span>9:41</span><span>●●● ▲</span></div>
<div class="scroll">
<div class="navlarge">设置</div>
<div class="stat">只在这台手机上。门锁数据不联网。</div>
<div class="card">
  <div class="chead"><h3>门锁</h3></div>
  <div class="rule"></div>
  <div class="navrow"><span class="tile" style="--t:#2E86E8">◎</span><span><span class="t">锁实况</span><small>电量 / 信号 / 固件 / 时钟</small></span><span class="chev">›</span></div>
  <div class="navrow"><span class="tile" style="--t:#5B6169">⚙</span><span><span class="t">锁设置</span><small>静音 / 防尾随 / 安全模式 / 布防</small></span><span class="chev">›</span></div>
  <div class="navrow"><span class="tile" style="--t:#5B6169">▩</span><span><span class="t">我的锁</span><small>全部锁 / 锁档案 / 版面</small></span><span class="chev">›</span></div>
</div>
<div class="card">
  <div class="chead"><h3>安全</h3><span>本机与锁端</span></div>
  <div class="rule"></div>
  <div class="navrow"><span class="tile" style="--t:#12684A">☎</span><span><span class="t">本机密码与生物识别</span><small>解锁 / 只读钥匙 / 读取锁都在这一页</small></span><span class="chev">›</span></div>
  <div class="navrow"><span class="tile" style="--t:#12684A">➤</span><span><span class="t">靠近自动开锁</span><small>默认关：开启前先标定距离</small></span><span class="chev">›</span></div>
</div>
<div class="card">
  <div class="chead"><h3>外观</h3><span>看与读</span></div>
  <div class="rule"></div>
  <div class="navrow"><span class="tile" style="--t:#6A3FB8">✎</span><span><span class="t">主题、图标与阅读</span><small>强调色 / 密度 / 快捷格 / 无障碍</small></span><span class="chev">›</span></div>
</div>
<div class="tabbar">
  <div class="tb"><i>▣</i>门</div><div class="tb"><i>⚿</i>钥匙</div>
  <div class="tb"><i>≡</i>台账</div><div class="tb"><i>☺</i>家</div>
  <div class="tb on"><span class="pill"></span><i>⚙</i>设置</div>
</div></div>
<div class="foot">设置 · V9 液态仪器 · light</div>
</div></body></html>
