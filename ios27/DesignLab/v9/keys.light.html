<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>@import "v9.css";
.phone[data-atmo="violet"]::before{background:radial-gradient(closest-side,rgba(106,63,184,.10),transparent 72%)}
.phone[data-atmo="violet"]::after{background:radial-gradient(closest-side,rgba(46,134,232,.10),transparent 72%)}
</style></head>
<body><div class="phone" data-mode="light" data-atmo="violet">
<div class="statusbar"><span>9:41</span><span>●●● ▲</span></div>
<div class="scroll">
<div class="navlarge">凭证都在有效期内</div>
<div class="stat">全部永久有效。凭证台账只在本机，不联网、不上传。</div>
<div class="chips">
  <span class="chip on"><b>全部</b></span>
  <span class="chip"><span class="dot" style="background:#0558B8"></span>密码 <b>4</b></span>
  <span class="chip"><span class="dot" style="background:#6A3FB8"></span>指纹 <b>7</b></span>
  <span class="chip"><span class="dot" style="background:#8A5A0B"></span>临时码</span>
  <span class="chip"><span class="dot" style="background:#12684A"></span>手机钥匙</span>
</div>
<div class="card">
  <div class="chead"><h3>凭证台账</h3><span>13 枚</span></div>
  <div class="rule"></div>
  <div class="row"><span class="tag" style="color:#0558B8">密码</span>长期 · 大门<span style="color:var(--ink4);font-size:12px">成员C</span><span class="val">永久</span></div>
  <div class="row"><span class="tag" style="color:#6A3FB8">指纹</span>指纹 9<span style="color:var(--ink4);font-size:12px">成员B</span><span class="val">永久</span></div>
  <div class="row"><span class="tag" style="color:#6A3FB8">指纹</span>指纹 10<span style="color:var(--ink4);font-size:12px">成员B</span><span class="val">永久</span></div>
  <div class="row"><span class="tag" style="color:#8A5A0B">临时码</span>C1 合成临时码<span class="val" style="color:#8A5A0B">明天</span></div>
  <div class="row"><span class="tag" style="color:#12684A">手机钥匙</span>成员 A 的手机钥匙<span class="val">28</span><span class="unit">天</span></div>
</div>
<div class="card">
  <div class="chead"><h3>到期压力</h3><span>1 枚 3 天内到期</span></div>
  <div class="rule"></div>
  <div class="statrow" style="padding:0">
    <div class="statbox"><small>最近到期</small><b>明天到期</b></div>
    <div class="statbox"><small>已过期</small><b>0 枚</b></div>
  </div>
</div>
<div class="card">
  <div class="chead"><h3>凭证工具</h3></div>
  <div class="csub">六个入口</div>
  <div class="rule"></div>
  <div class="navrow"><span class="tile" style="--t:#2E86E8">＋</span><span><span class="t">新增凭证</span><small>密码 / 指纹 / 临时码</small></span><span class="chev">›</span></div>
  <div class="navrow"><span class="tile" style="--t:#6A3FB8">◈</span><span><span class="t">凭证工作室</span><small>批量 / 回收站 / 版本</small></span><span class="chev">›</span></div>
  <div class="navrow"><span class="tile" style="--t:#12684A">✆</span><span><span class="t">手机钥匙</span><small>给家人的手机签一把钥匙</small></span><span class="chev">›</span></div>
</div>
<div class="tabbar">
  <div class="tb"><i>▣</i>门</div>
  <div class="tb on"><span class="pill"></span><i>⚿</i>钥匙</div>
  <div class="tb"><i>≡</i>台账</div>
  <div class="tb"><i>☺</i>家</div>
  <div class="tb"><i>⚙</i>设置</div>
</div></div>
<div class="foot">钥匙 · V9 液态仪器 · light</div>
</div></body></html>
