# XcodeGen 工程定义 — 生成 OfflineLock.xcodeproj (CI 上 brew install xcodegen 后执行)
# 编译 SDK: CI 用 `xcode-27` 预览镜像的 iOS 27.2 (Xcode 27.2); 稳定通道 macos-latest 最高 iOS 26.5。
# 最低部署版本: iOS 27.0 (2026-10-17 按"全量最新"拍板抬上来; 代价 = 手机必须是 iOS 27+, iOS 26.x 装不上)
name: OfflineLock
options:
  bundleIdPrefix: com.aapk
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    # ============ Swift 6 语言模式 (2026-10-17 收尾) ============
    # 迁移路径 (两步, 已走完):
    #   ① 先 SWIFT_VERSION 5.0 + SWIFT_STRICT_CONCURRENCY complete —— 跨隔离访问是**告警**,
    #      工程照常绿, 而告警清单就是完整待办表 (实测 154 条, 其中 120 条是并发红线)。
    #   ② 按清单逐条原生修完 (纯函数 nonisolated / UI 与 UIKit 读点 @MainActor /
    #      跨线程共享状态进 Locked 锁 / 系统框架回调走 @Sendable 边界 + Task 跳主 actor),
    #      再把 SWIFT_VERSION 切到 6.0。这一行是收尾, 不是起点。
    # 全仓零 nonisolated(unsafe)、零 MainActor.assumeIsolated —— 检查没有被关掉任何一处。
    # Swift 6 下 strict concurrency 恒为 complete, 故不再显式写 SWIFT_STRICT_CONCURRENCY。
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
    # Release 锁死"最快档": 整模块优化 + 全量优化 + 去断言 (默认就是这三项, 显式写出来防止将来漂)
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_NS_ASSERTIONS: NO
targets:
  OfflineLock:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 离线锁管家
        CFBundleShortVersionString: "1.0.0"
        # CFBundleVersion 是**出厂默认**, 不是最终值: CI 的"注入编译号"步骤会在
        # xcodegen generate 之后把它改成本次构建时刻 (yyyyMMdd.HHmmss, 东八区; stamp 作业
        # 那个唯一时刻)。改这里没用 —— 每次 push 都会被覆盖, 想改口径去改那条步骤。
        # 默认留 "1" 而不是写死日期: 写死的日期在本地构建里永远是假的。
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # 294 本地深链 (kf://): 快捷指令「打开 App」带参数直达; 只允许白名单路由, 且在应用锁未解开时不落地
        CFBundleURLTypes:
          - CFBundleURLName: kf.lockkeeper.deeplink
            CFBundleURLSchemes:
              - kf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: 需要蓝牙连接并管理你的智能门锁 (扫描/配网/开锁/固件升级)。
        NSBluetoothPeripheralUsageDescription: 需要蓝牙连接并管理你的智能门锁。
        # 缺这条 = 首启引导第 4 步「权限说明」点继续即被系统终止进程 (TCC 对缺键不弹窗, 直接杀)。
        # 触发点: App/UI/Onboarding.swift requestSystemPermissions() 里的 CLLocationManager.requestWhenInUseAuthorization()。
        # ⚠ 截至本批, 全仓没有任何一处读坐标 / 启动 locateing service —— 这条权限目前是"申请了但无消费方"。
        #    保留它按拍板"以后要用定位 (到位置身/地理围栏)"预留; 真正接线时把下面这句改成那件事本身。
        NSLocationWhenInUseUsageDescription: 为"到家自动开锁"这类到位置身功能预留；当前版本不读取你的坐标，位置数据不出本机。
        # 缺这条 = 一弹面容就废：本仓已有四处调 LAContext.evaluatePolicy
        # (AuthKit 877 口令连败大字键 / AutoOpen 严格档 F1 门控 / CredentialCenterView 502 彻底删除双验)。
        NSFaceIDUsageDescription: 用面容确认这一步是本人在操作：毁灭级操作前的复核、访客模式放开凭证与设置前的复核、靠近自动开锁的严格档。
        NSPhotoLibraryAddUsageDescription: 将成就分享卡保存到相册 (完全本地生成, 不上传)。
        # 包8/411 恢复页相机扫码识别二维码备份 (纯本地 CoreImage 解码, 无网络)
        NSCameraUsageDescription: 识别备份二维码, 用于换机扫码搬运 (411, 全程本地解码无网络)。
        ITSAppUsesNonExemptEncryption: false
        # 备选 App 图标 (包16/idea 896): 键名 = setAlternateIconName 入参, 与 Assets.xcassets 的 appiconset 同名
        # 896 由 4 款扩到 9 款 (2026-10-12 拍板"造位图"): 新增五款的位图由 _audit1012/mkicon.js 按
        # 下面这五个品牌色与几何画出 (底色必须与 SettingsView.iconOptions 里的 hex 逐字相同, 否则
        # "缩略预览色块与真实 PNG 同底色同符号"那句承诺就成假话)。
        # 2026-10-14 对抗式排查: Apple 规定备选图标是 **CFBundleIcons 的子键**
        # (CFBundleIcons -> CFBundleAlternateIcons)。平铺在 Info.plist 根层时 iOS 不认这些键,
        # setAlternateIconName 找不到图标 -> 换图标静默失败。故外包一层 CFBundleIcons。
        CFBundleIcons:
          CFBundleAlternateIcons:
            AppIcon-Ring:
              CFBundleIconFiles:
                - AppIcon-Ring
            AppIcon-Key:
              CFBundleIconFiles:
                - AppIcon-Key
            AppIcon-Shield:
              CFBundleIconFiles:
                - AppIcon-Shield
            AppIcon-Home:
              CFBundleIconFiles:
                - AppIcon-Home
            AppIcon-Bell:
              CFBundleIconFiles:
                - AppIcon-Bell
            AppIcon-Pin:
              CFBundleIconFiles:
                - AppIcon-Pin
            AppIcon-Guard:
              CFBundleIconFiles:
                - AppIcon-Guard
            AppIcon-Heart:
              CFBundleIconFiles:
                - AppIcon-Heart
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
  OfflineLockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: fixtures/golden.json
        buildPhase: resources
      - path: vendor/fixture/KX_V5.2.9_180503183402.zip
        buildPhase: resources
    dependencies:
      - target: OfflineLock
    info:
      path: Tests/Info.plist
      properties: {}
schemes:
  OfflineLock:
    build:
      targets:
        OfflineLock: all
        OfflineLockTests: [test]
    test:
      targets:
        - OfflineLockTests
