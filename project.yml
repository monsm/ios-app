# XcodeGen 工程定义 — 生成 OfflineLock.xcodeproj (CI 上 brew install xcodegen 后执行)
# 目标: 最新 iOS SDK (Xcode 26.6 / iOS 26.5), 最低部署版本 iOS 26.5
name: OfflineLock
options:
  bundleIdPrefix: com.aapk
  deploymentTarget:
    iOS: "26.5"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  OfflineLock:
    type: application
    platform: iOS
    sources:
      - path: App
      # 77/939/941: 开锁实时活动的属性类型 —— **同时编进主 App 与 widget 两个 target**,
      # 因为 ActivityKit 要求属性类型跨 target 形状一致, 而 app-extension 不能 import 主 App 的类型。
      - path: Shared
    # 927: 桌面小组件扩展。XcodeGen 会把 app-extension 依赖自动放进 PlugIns/ (embed 默认 true)
    dependencies:
      - target: OfflineLockWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 离线锁管家
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # 294 本地深链 (kf://): 快捷指令「打开 App」带参数直达; 只允许白名单路由, 且在应用锁未解开时不落地
        CFBundleURLTypes:
          - CFBundleURLName: kf.lockkeeper.deeplink
            CFBundleURLSchemes:
              - kf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: 需要蓝牙连接并管理你的智能门锁 (扫描/配网/开锁/固件升级)。
        NSBluetoothPeripheralUsageDescription: 需要蓝牙连接并管理你的智能门锁。
        # 缺这条 = 首启引导第 4 步「权限说明」点继续即被系统终止进程 (TCC 对缺键不弹窗, 直接杀)。
        # 触发点: App/UI/Onboarding.swift requestSystemPermissions() 里的 CLLocationManager.requestWhenInUseAuthorization()。
        # ⚠ 截至本批, 全仓没有任何一处读坐标 / 启动 locateing service —— 这条权限目前是"申请了但无消费方"。
        #    保留它按拍板"以后要用定位 (到位置身/地理围栏)"预留; 真正接线时把下面这句改成那件事本身。
        NSLocationWhenInUseUsageDescription: 为"到家自动开锁"这类到位置身功能预留；当前版本不读取你的坐标，位置数据不出本机。
        # 缺这条 = 一弹面容就废：本仓已有四处调 LAContext.evaluatePolicy
        # (AuthKit 877 口令连败大字键 / AutoOpen 严格档 F1 门控 / CredentialCenterView 502 彻底删除双验)。
        NSFaceIDUsageDescription: 用面容确认这一步是本人在操作：应用锁连败后的替代键、靠近自动开锁的严格档、以及彻底删除回收站凭证前的二次确认。
        NSPhotoLibraryAddUsageDescription: 将成就分享卡保存到相册 (完全本地生成, 不上传)。
        # 包8/411 恢复页相机扫码识别二维码备份 (纯本地 CoreImage 解码, 无网络)
        NSCameraUsageDescription: 识别备份二维码, 用于换机扫码搬运 (411, 全程本地解码无网络)。
        # 包8/428 充电自动备份: BGTask 注册 (执行时机由系统择机, 不承诺接电即备; 7 天签名下照常调度)
        BGTaskSchedulerPermittedIdentifiers:
          - com.kf.chargebackup
        # 2026-10-14: BGAppRefreshTaskRequest.submit 要求声明 fetch 后台模式, 缺它 submit 会被系统
        # 直接拒 (notPermitted) 且旧实现 try? 吞掉 —— 功能"看起来装了其实从没跑过"。
        UIBackgroundModes:
          - fetch
        ITSAppUsesNonExemptEncryption: false
        # 77/939/941 实时活动 (灵动岛/锁屏): 缺这一条 Activity.request 直接失败
        NSSupportsLiveActivities: true
        # 备选 App 图标 (包16/idea 896): 键名 = setAlternateIconName 入参, 与 Assets.xcassets 的 appiconset 同名
        # 896 由 4 款扩到 9 款 (2026-10-12 拍板"造位图"): 新增五款的位图由 _audit1012/mkicon.js 按
        # 下面这五个品牌色与几何画出 (底色必须与 SettingsView.iconOptions 里的 hex 逐字相同, 否则
        # "缩略预览色块与真实 PNG 同底色同符号"那句承诺就成假话)。
        # 2026-10-14 对抗式排查: Apple 规定备选图标是 **CFBundleIcons 的子键**
        # (CFBundleIcons -> CFBundleAlternateIcons)。平铺在 Info.plist 根层时 iOS 不认这些键,
        # setAlternateIconName 找不到图标 -> 换图标静默失败。故外包一层 CFBundleIcons。
        CFBundleIcons:
          CFBundleAlternateIcons:
            AppIcon-Ring:
              CFBundleIconFiles:
                - AppIcon-Ring
            AppIcon-Key:
              CFBundleIconFiles:
                - AppIcon-Key
            AppIcon-Shield:
              CFBundleIconFiles:
                - AppIcon-Shield
            AppIcon-Home:
              CFBundleIconFiles:
                - AppIcon-Home
            AppIcon-Bell:
              CFBundleIconFiles:
                - AppIcon-Bell
            AppIcon-Pin:
              CFBundleIconFiles:
                - AppIcon-Pin
            AppIcon-Guard:
              CFBundleIconFiles:
                - AppIcon-Guard
            AppIcon-Heart:
              CFBundleIconFiles:
                - AppIcon-Heart
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
  # 927 哑按钮小组件 (拍板 #30 选 B)。免费账号无 App Groups → 这个 target 读不到主 App 的任何数据
  # (docs/CONSTRAINTS.md 的 ❌ 表)，因此它只能拉起 App，不显示锁状态/电量 (那属已判 ❌ 的 924)。
  OfflineLockWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared   # 77/939/941: 与主 App 共用同一份活动属性定义 (见上)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aapk.OfflineLock.widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 离线锁管家
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  OfflineLockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: fixtures/golden.json
        buildPhase: resources
      - path: vendor/fixture/KX_V5.2.9_180503183402.zip
        buildPhase: resources
    dependencies:
      - target: OfflineLock
    info:
      path: Tests/Info.plist
      properties: {}
schemes:
  OfflineLock:
    build:
      targets:
        OfflineLock: all
        OfflineLockTests: [test]
    test:
      targets:
        - OfflineLockTests
